ε λένε","f":["me llamo","te llamas","se llama","nos llamamos","os llamáis","se llaman"]}],"23":[{"v":"tener","t":"pres","m":"έχω","f":["tengo","tienes","tiene","tenemos","tenéis","tienen"]}],"24":[],"25":[{"v":"querer","t":"pres","m":"θέλω","f":["quiero","quieres","quiere","queremos","queréis","quieren"]},{"v":"comer","t":"pres","m":"τρώω","f":["como","comes","come","comemos","coméis","comen"]},{"v":"beber","t":"pres","m":"πίνω","f":["bebo","bebes","bebe","bebemos","bebéis","beben"]}],"26":[{"v":"estar","t":"pres","m":"είμαι, βρίσκομαι","f":["estoy","estás","está","estamos","estáis","están"]},{"v":"ir","t":"pres","m":"πηγαίνω","f":["voy","vas","va","vamos","vais","van"]}],"27":[{"v":"hablar","t":"pres","m":"μιλάω","f":["hablo","hablas","habla","hablamos","habláis","hablan"]},{"v":"trabajar","t":"pres","m":"δουλεύω","f":["trabajo","trabajas","trabaja","trabajamos","trabajáis","trabajan"]},{"v":"vivir","t":"pres","m":"ζω, μένω","f":["vivo","vives","vive","vivimos","vivís","viven"]}],"28":[{"v":"comprar","t":"pres","m":"αγοράζω","f":["compro","compras","compra","compramos","compráis","compran"]}]},"tense":{"pres":"Ενεστώτας","ger":"estar + gerundio (τώρα)","perf":"Παρακείμενος","ind":"Αόριστος","imp":"Παρατατικός","impv":"Προστακτική (tú)"},"theory":{"1":[{"h":"Ser = είμαι","p":["Το [[ser]] λέει ποιος ή τι είναι κάποιος: εθνικότητα, καταγωγή, επάγγελμα."],"t":[["","ser"],["yo","soy"],["tú","eres"],["él / ella / usted","es"],["nosotros/as","somos"],["vosotros/as","sois"],["ellos / ustedes","son"]],"ex":[["Soy griego.","Είμαι Έλληνας."],["Soy de Grecia.","Είμαι από την Ελλάδα."],["Ella es médica.","Αυτή είναι γιατρός."]],"tip":"Το επάγγελμα μπαίνει χωρίς άρθρο: [[Soy ingeniero]], όχι «soy un ingeniero».","i":"Τα ισπανικά έχουν δύο ρήματα για το «είμαι»: το [[ser]] και το [[estar]]. Το [[ser]] λέει ΠΟΙΟΣ ή ΤΙ είναι κάποιος, δηλαδή πράγματα που τον χαρακτηρίζουν και δεν αλλάζουν από μέρα σε μέρα.","w":[["Όνομα","[[Soy Ioannis.]] = Είμαι ο Γιάννης."],["Εθνικότητα και καταγωγή","[[Soy griego.]] · [[Soy de Grecia.]]"],["Επάγγελμα","[[Soy médico.]] Χωρίς un / una."],["Σχέση","[[Es mi hermano.]] = Είναι ο αδελφός μου."],["Χαρακτήρας","[[Es simpática.]] = Είναι συμπαθητική."],["ΟΧΙ για το πού βρίσκεσαι","Εκεί θέλει [[estar]]: [[Estoy en casa.]]"]],"e":["Soy un profesor.","Soy profesor.","Στο επάγγελμα δεν μπαίνει un / una."]},{"h":"Llamarse και tener","p":["Το [[llamarse]] (λέγομαι) παίρνει μπροστά [[me, te, se, nos, os, se]]. Την ηλικία τη λέμε με το [[tener]] (έχω)."],"t":[["","llamarse","tener"],["yo","me llamo","tengo"],["tú","te llamas","tienes"],["él / ella","se llama","tiene"],["nosotros","nos llamamos","tenemos"],["vosotros","os llamáis","tenéis"],["ellos","se llaman","tienen"]],"ex":[["¿Cómo te llamas? – Me llamo Ana.","Πώς σε λένε; – Με λένε Άννα."],["¿Cuántos años tienes? – Tengo 25 años.","Πόσο χρονών είσαι; – Είμαι 25."]],"i":"Δύο ρήματα που θα πεις στην πρώτη σου γνωριμία: [[llamarse]] για το όνομα και [[tener]] για το τι έχεις και για την ηλικία σου.","w":[["me llamo + όνομα","Λες πώς σε λένε: [[Me llamo Ana.]] Κατά λέξη: «ονομάζομαι»."],["tengo + πράγμα","Λες τι έχεις: [[Tengo dos hermanos.]]"],["tengo + αριθμός + años","Λες την ηλικία σου: [[Tengo treinta años.]] Στα ισπανικά «έχεις» χρόνια, δεν «είσαι»."]],"e":["Soy treinta años.","Tengo treinta años.","Η ηλικία λέγεται με το tener."]},{"h":"Γένος: επαγγέλματα και εθνικότητες","t":[["Κανόνας","Αρσενικό","Θηλυκό"],["-o → -a","médico, griego","médica, griega"],["σύμφωνο → + a","profesor, español","profesora, española"],["-és / -án → χάνει τον τόνο","francés, alemán","francesa, alemana"],["-ista, -ante, -e, -í: ίδιο","periodista, estudiante","periodista, estudiante"]],"tip":"Εθνικότητες και γλώσσες γράφονται με μικρό: [[Soy griego. Hablo inglés.]]","i":"Στα ισπανικά το επάγγελμα και η εθνικότητα αλλάζουν κατάληξη ανάλογα με το αν μιλάς για άντρα ή για γυναίκα, όπως στα ελληνικά «δάσκαλος / δασκάλα».","s":["Κοίτα πώς τελειώνει το αρσενικό.","Αν τελειώνει σε [[-o]], κάνε το [[-a]]: [[griego → griega]].","Αν τελειώνει σε σύμφωνο, πρόσθεσε [[-a]]: [[español → española]].","Αν τελειώνει σε [[-ista]], [[-ante]] ή [[-e]], μένει ίδιο: [[el estudiante, la estudiante]]."],"e":["María es griego.","María es griega.","Για γυναίκα θέλει θηλυκή κατάληξη."]},{"h":"Para, porque και άρνηση","p":["[[para]] + απαρέμφατο = για να (σκοπός). [[porque]] + κλιμένο ρήμα = επειδή (αιτία).","Για άρνηση βάζεις [[no]] πριν από το ρήμα."],"ex":[["Estudio español para viajar.","Μαθαίνω ισπανικά για να ταξιδεύω."],["Estudio español porque me gusta.","Μαθαίνω ισπανικά επειδή μου αρέσει."],["No hablo francés.","Δεν μιλάω γαλλικά."]],"tip":"[[¿Por qué?]] (δύο λέξεις, με τόνο) = γιατί; · [[porque]] (μία λέξη) = επειδή.","i":"Τρία μικρά εργαλεία για να εξηγείς τον λόγο που κάνεις κάτι και για να λες «όχι».","w":[["para + απαρέμφατο","Για ΣΚΟΠΟ, «για να»: [[Estudio español para viajar.]] = Μαθαίνω ισπανικά για να ταξιδέψω. Το ρήμα μετά μένει στο απαρέμφατο (-ar, -er, -ir)."],["porque + κλιμένο ρήμα","Για ΑΙΤΙΑ, «επειδή»: [[Estudio español porque me gusta.]]"],["¿por qué?","Για ΕΡΩΤΗΣΗ, «γιατί;». Δύο λέξεις και τόνος."],["no + ρήμα","Για άρνηση. Το [[no]] μπαίνει ακριβώς πριν από το ρήμα: [[No hablo francés.]]"]],"e":["Estudio español para viajo.","Estudio español para viajar.","Μετά το para το ρήμα δεν κλίνεται."]}],"2":[{"h":"Η ώρα","p":["Ρωτάμε [[¿Qué hora es?]]. Για τη μία λέμε [[Es la una]], για όλες τις άλλες [[Son las…]].","Μέχρι τις :30 λέμε [[y]] (και). Μετά πάμε στην επόμενη ώρα με [[menos]] (παρά)."],"t":[["Ώρα","Ισπανικά"],["1:00","Es la una"],["3:00","Son las tres en punto"],["3:15","Son las tres y cuarto"],["3:30","Son las tres y media"],["3:45","Son las cuatro menos cuarto"],["3:50","Son las cuatro menos diez"]],"tip":"[[Son las tres]] = είναι τρεις. [[A las tres]] = στις τρεις: [[Ceno a las nueve.]]","i":"Η ώρα λέγεται όπως στα ελληνικά: «είναι τρεις και δέκα», «είναι τέσσερις παρά δέκα».","w":[["Son las tres","Λες ΤΙ ΩΡΑ ΕΙΝΑΙ τώρα."],["A las tres","Λες ΠΟΤΕ γίνεται κάτι: [[Como a las tres.]] = Τρώω στις τρεις."],["de la mañana / tarde / noche","Προσθέτεις αν είναι πρωί, απόγευμα ή βράδυ: [[las ocho de la tarde]]."]],"s":["Ξεκίνα με [[Son las]] + την ώρα. Μόνο για τη μία λες [[Es la una]].","Αν τα λεπτά είναι από 1 έως 30, βάλε [[y]] + τα λεπτά: 3:10 = [[Son las tres y diez.]]","Αν είναι από 31 έως 59, πήγαινε στην ΕΠΟΜΕΝΗ ώρα και βάλε [[menos]] + όσα λεπτά λείπουν: 3:50 = [[Son las cuatro menos diez.]]","Για :15 λες [[cuarto]] και για :30 λες [[media]]."],"e":["Es las dos.","Son las dos.","Μόνο η μία παίρνει es: Es la una."]},{"h":"Μέρη της ημέρας","p":["Χωρίς ώρα λέμε [[por]]: [[por la mañana, por la tarde, por la noche]]. Με ώρα λέμε [[de]]: [[a las ocho de la mañana]].","[[de … a]] = από … μέχρι. [[antes de / después de]] + απαρέμφατο = πριν / μετά."],"ex":[["Estudio por la tarde.","Διαβάζω το απόγευμα."],["Trabajo de nueve a cinco.","Δουλεύω από τις 9 μέχρι τις 5."],["Desayuno antes de ir a clase.","Τρώω πρωινό πριν πάω στο μάθημα."],["Los lunes voy al gimnasio.","Τις Δευτέρες πάω γυμναστήριο."]],"i":"Πώς λες «το πρωί», «το απόγευμα», «πριν» και «μετά».","w":[["por la mañana","Όταν ΔΕΝ λες ώρα: [[Trabajo por la mañana.]] = Δουλεύω το πρωί."],["de la mañana","Όταν ΛΕΣ ώρα: [[a las ocho de la mañana]] = στις οκτώ το πρωί."],["de … a …","Από … μέχρι: [[de nueve a cinco]]."],["antes de / después de + απαρέμφατο","Πριν / μετά από κάτι: [[Me ducho antes de desayunar.]]"]],"e":["a las ocho por la mañana","a las ocho de la mañana","Με ώρα μπροστά θέλει de, όχι por."]},{"h":"Ενεστώτας ομαλών ρημάτων","p":["Βγάζεις το -ar, -er ή -ir και βάζεις την κατάληξη."],"t":[["","hablar","comer","vivir"],["yo","hablo","como","vivo"],["tú","hablas","comes","vives"],["él / ella / usted","habla","come","vive"],["nosotros/as","hablamos","comemos","vivimos"],["vosotros/as","habláis","coméis","vivís"],["ellos / ustedes","hablan","comen","viven"]],"tip":"Το «εγώ» τελειώνει πάντα σε -o. Τα -er και -ir διαφέρουν μόνο στο nosotros και στο vosotros.","i":"Ο ενεστώτας λέει τι κάνεις τώρα ή τι κάνεις συνήθως. Κάθε πρόσωπο έχει τη δική του κατάληξη, γι' αυτό το «εγώ», «εσύ» συνήθως παραλείπονται, όπως στα ελληνικά.","w":[["tú","«Εσύ», σε φίλο ή συγγενή."],["usted","«Εσείς» ευγενείας, σε έναν άγνωστο ή μεγαλύτερο. Κλίνεται όπως το él / ella: [[¿Habla usted español?]]"],["vosotros","«Εσείς», σε πολλούς φίλους (στην Ισπανία)."],["ustedes","«Εσείς», σε πολλούς με ευγένεια. Κλίνεται όπως το ellos."]],"s":["Δες πώς τελειώνει το ρήμα: [[-ar]], [[-er]] ή [[-ir]].","Κόψε την κατάληξη: [[hablar → habl-]].","Βάλε την κατάληξη του προσώπου από τον πίνακα: [[habl- + o = hablo]] (μιλάω)."],"e":["Yo hablar español.","Yo hablo español.","Το απαρέμφατο (hablar) δεν χρησιμοποιείται αυτούσιο, πρέπει να κλιθεί."]},{"h":"Αυτοπαθή ρήματα (-se)","p":["Μοιάζουν με τα ελληνικά σε -ομαι. Κλίνονται κανονικά, με [[me, te, se, nos, os, se]] μπροστά."],"t":[["","levantarse"],["yo","me levanto"],["tú","te levantas"],["él / ella","se levanta"],["nosotros","nos levantamos"],["vosotros","os levantáis"],["ellos","se levantan"]],"ex":[["Me levanto a las siete y me ducho.","Σηκώνομαι στις επτά και κάνω ντους."]],"i":"Αυτοπαθές είναι το ρήμα όπου αυτός που κάνει την πράξη τη δέχεται κιόλας: πλένομαι, σηκώνομαι, ντύνομαι. Στο λεξικό τελειώνουν σε [[-se]].","w":[["Με se","Το κάνεις στον εαυτό σου: [[Me lavo las manos.]] = Πλένω τα χέρια μου."],["Χωρίς se","Το κάνεις σε κάτι άλλο: [[Lavo el coche.]] = Πλένω το αυτοκίνητο."]],"s":["Βγάλε το [[-se]]: [[levantarse → levantar]].","Κλίνε το ρήμα κανονικά: [[levanto, levantas…]]","Βάλε ΜΠΡΟΣΤΑ τη μικρή λέξη του προσώπου: [[me, te, se, nos, os, se]] → [[me levanto]]."],"e":["Yo levanto a las siete.","Me levanto a las siete.","Χωρίς το me σημαίνει «σηκώνω κάτι», όχι «σηκώνομαι»."]}],"3":[{"h":"Es · hay · está","t":[["","Τι δείχνει","Τι ακολουθεί"],["es / son","περιγραφή: πώς ή τι είναι","επίθετο, un/una + ουσιαστικό"],["hay","ύπαρξη: υπάρχει, υπάρχουν","un/una, αριθμός, muchos, χωρίς άρθρο"],["está / están","θέση: πού βρίσκεται","el/la/los/las, mi/tu, όνομα"]],"ex":[["Mi barrio es tranquilo.","Η γειτονιά μου είναι ήσυχη."],["Hay un parque.","Υπάρχει ένα πάρκο."],["El parque está cerca.","Το πάρκο είναι κοντά."],["En mi barrio hay un mercado. El mercado está en la plaza. Es muy grande.","Στη γειτονιά μου υπάρχει μια αγορά. Η αγορά είναι στην πλατεία. Είναι πολύ μεγάλη."]],"tip":"Ποτέ «hay el parque». Με [[el/la]] πάει το [[está]], με [[un/una]] πάει το [[hay]].","i":"Τρεις λέξεις που στα ελληνικά βγαίνουν όλες «είναι» ή «έχει», αλλά στα ισπανικά έχουν η καθεμία τη δουλειά της.","w":[["hay = υπάρχει","Λες ότι ΥΠΑΡΧΕΙ κάτι, συνήθως πρώτη φορά. Μετά βάζεις [[un / una]], αριθμό ή [[muchos]]: [[Hay un parque.]] Δεν αλλάζει ποτέ, ούτε στον πληθυντικό: [[Hay dos parques.]]"],["está = βρίσκεται","Λες ΠΟΥ είναι κάτι συγκεκριμένο, που ο άλλος ήδη το ξέρει. Πριν έχει [[el / la]], [[mi]] ή όνομα: [[El parque está cerca.]]"],["es = είναι","Λες ΤΙ είναι ή ΠΩΣ είναι κάτι: [[El parque es grande.]]"]],"s":["Ρώτα τον εαυτό σου: θα έλεγα «υπάρχει» στα ελληνικά; Τότε [[hay]].","Απαντάω στο «πού;» Τότε [[está]].","Απαντάω στο «πώς είναι;» ή «τι είναι;» Τότε [[es]]."],"e":["Hay el banco en la plaza.","El banco está en la plaza.","Το hay δεν πάει ποτέ με el / la."]},{"h":"Τα άρθρα","t":[["","Οριστικό","Αόριστο"],["αρσενικό ενικός","el","un"],["θηλυκό ενικός","la","una"],["αρσενικό πληθυντικός","los","unos"],["θηλυκό πληθυντικός","las","unas"]],"p":["[[a + el = al]], [[de + el = del]]. Το [[unos]] πριν από αριθμό σημαίνει «περίπου»: [[a unos diez minutos]]. Χώρες και πόλεις δεν παίρνουν άρθρο: [[Vivo en Tesalónica.]]"],"i":"Το άρθρο είναι η μικρή λέξη πριν από το ουσιαστικό: «ο, η, το» ή «ένας, μία, ένα». Στα ισπανικά υπάρχουν μόνο αρσενικό και θηλυκό, όχι ουδέτερο.","w":[["el / la / los / las","«Ο, η, το». Για κάτι ΣΥΓΚΕΚΡΙΜΕΝΟ που ξέρουμε και οι δύο: [[El bar de la esquina.]]"],["un / una","«Ένας, μία». Για κάτι που το λες ΠΡΩΤΗ ΦΟΡΑ ή δεν έχει σημασία ποιο: [[Hay un bar.]]"],["unos / unas","«Μερικοί, κάτι». Πριν από αριθμό σημαίνει «περίπου»: [[unos diez minutos]]."],["al / del","[[a + el]] γίνεται πάντα [[al]] και [[de + el]] γίνεται [[del]]: [[Voy al cine.]]"]],"e":["Voy a el cine.","Voy al cine.","Το a + el ενώνεται πάντα σε al."],"ex":[["Hay un bar en mi calle. El bar es pequeño.","Υπάρχει ένα μπαρ στον δρόμο μου. Το μπαρ είναι μικρό."]]},{"h":"Κατευθύνσεις","p":["[[a]] για κατεύθυνση και απόσταση, [[en]] για θέση, [[de]] μετά από [[cerca, lejos, al lado]]."],"t":[["Ισπανικά","Ελληνικά"],["todo recto","ευθεία"],["a la derecha / a la izquierda","δεξιά / αριστερά"],["al lado de","δίπλα σε"],["al final de","στο τέλος του"],["en la esquina","στη γωνία"],["cerca de / lejos de","κοντά σε / μακριά από"],["a unos 10 minutos a pie","περίπου 10 λεπτά με τα πόδια"]],"ex":[["Sigue todo recto y gira a la derecha.","Συνέχισε ευθεία και στρίψε δεξιά."],["Toma la segunda calle a la izquierda.","Πάρε τον δεύτερο δρόμο αριστερά."]],"i":"Για να δώσεις οδηγίες χρειάζεσαι τρεις μικρές λέξεις, [[a]], [[en]] και [[de]], και τρία ρήματα: [[sigue]] (συνέχισε), [[gira]] (στρίψε), [[toma]] (πάρε).","w":[["a","Προς τα ΠΟΥ πας ή ΠΟΣΟ μακριά είναι: [[a la derecha]], [[a cinco minutos]]."],["en","ΠΟΥ ακριβώς βρίσκεται: [[en la esquina]], [[en la calle Mayor]]."],["de","Μετά από [[cerca]], [[lejos]], [[al lado]], [[enfrente]]: [[cerca de la plaza]]."],["sigue / gira / toma","Οδηγίες σε φίλο: [[Sigue todo recto y gira a la izquierda.]]"]],"e":["Está cerca la farmacia.","Está cerca de la farmacia.","Μετά το cerca χρειάζεται de."]},{"h":"Τακτικά αριθμητικά","p":["[[primero, segundo, tercero, cuarto, quinto, sexto, séptimo, octavo, noveno, décimo]]. Θηλυκό σε -a: [[la primera calle]]."],"tip":"Πριν από αρσενικό ουσιαστικό: [[primero → primer]], [[tercero → tercer]]: [[el tercer piso]].","i":"Πρώτος, δεύτερος, τρίτος… Τα χρειάζεσαι για ορόφους και για δρόμους («ο δεύτερος δρόμος δεξιά»).","w":[["primer, tercer","Πριν από ΑΡΣΕΝΙΚΟ ουσιαστικό το primero και το tercero χάνουν το -o: [[el primer piso]], [[el tercer día]]."],["primera, tercera","Πριν από θηλυκό μένουν ολόκληρα: [[la primera calle]]."],["Τα υπόλοιπα","Αλλάζουν μόνο -o / -a: [[el segundo piso]], [[la segunda calle]]."]],"e":["Vivo en el primero piso.","Vivo en el primer piso.","Πριν από αρσενικό ουσιαστικό: primer."]},{"h":"Ερωτηματικές λέξεις","t":[["Ισπανικά","Ελληνικά"],["¿Qué?","Τι;"],["¿Cómo?","Πώς;"],["¿Dónde? / ¿De dónde?","Πού; / Από πού;"],["¿Cuál? / ¿Cuáles?","Ποιο; / Ποια;"],["¿Cuánto/a? ¿Cuántos/as?","Πόσο; Πόσοι;"],["¿Quién? / ¿Quiénes?","Ποιος; / Ποιοι;"],["¿Cuándo?","Πότε;"],["¿Por qué?","Γιατί;"]],"tip":"Όλες γράφονται με τόνο και με ¿ στην αρχή της ερώτησης.","i":"Οι λέξεις με τις οποίες ξεκινάς μια ερώτηση. Όλες παίρνουν τόνο.","w":[["¿Qué?","«Τι;» Ζητάς πληροφορία: [[¿Qué haces?]] Και πριν από ουσιαστικό: [[¿Qué hora es?]]"],["¿Cuál?","«Ποιο;» Διαλέγεις ανάμεσα σε πολλά: [[¿Cuál es tu número?]]"],["¿Dónde? / ¿De dónde? / ¿Adónde?","Πού είναι; / Από πού; / Προς τα πού;"],["¿Cuánto/a/os/as?","«Πόσο;» Συμφωνεί με αυτό που μετράς: [[¿Cuántos años?]], [[¿Cuántas hermanas?]]"],["¿Quién? / ¿Quiénes?","«Ποιος;» για έναν, «ποιοι;» για πολλούς."]],"e":["¿Cuánto años tienes?","¿Cuántos años tienes?","Το cuánto συμφωνεί με το años (αρσενικό πληθυντικό)."]}],"4":[{"h":"Κτητικά","p":["Μπαίνουν πριν από το ουσιαστικό και συμφωνούν με αυτό που έχουμε, όχι με τον κάτοχο."],"t":[["","ενικός","πληθυντικός"],["μου","mi","mis"],["σου","tu","tus"],["του / της / σας","su","sus"],["μας","nuestro/a","nuestros/as"],["σας (vosotros)","vuestro/a","vuestros/as"],["τους","su","sus"]],"ex":[["Mi hermano y mis hermanas.","Ο αδελφός μου και οι αδελφές μου."],["Nuestra casa es grande.","Το σπίτι μας είναι μεγάλο."]],"tip":"[[tu]] χωρίς τόνο = σου. [[tú]] με τόνο = εσύ.","i":"Τα κτητικά λένε σε ποιον ανήκει κάτι: μου, σου, του. Στα ισπανικά μπαίνουν ΠΡΙΝ από το ουσιαστικό και ΧΩΡΙΣ άρθρο: [[mi casa]] = το σπίτι μου.","w":[["mi / mis","Δικό ΜΟΥ. [[mi]] για ένα πράγμα, [[mis]] για πολλά: [[mi hermano]], [[mis hermanos]]."],["tu / tus","Δικό ΣΟΥ (σε φίλο): [[tu madre]], [[tus padres]]."],["su / sus","Δικό ΤΟΥ, ΤΗΣ, ΤΟΥΣ, αλλά και ΣΑΣ στον πληθυντικό ευγενείας. Από τα συμφραζόμενα καταλαβαίνεις ποιο: [[su coche]]."],["nuestro/a · vuestro/a","Δικό ΜΑΣ και δικό ΣΑΣ (πολλοί φίλοι). Αυτά αλλάζουν και στο γένος: [[nuestra casa]], [[vuestro padre]]."]],"s":["Βρες ποιος είναι ο κάτοχος (εγώ → mi, εσύ → tu, αυτός → su…).","Κοίτα το πράγμα που έχει: αν είναι πολλά, βάλε [[-s]].","Το κτητικό συμφωνεί με το ΠΡΑΓΜΑ, όχι με τον κάτοχο: [[mis padres]] (εγώ είμαι ένας, οι γονείς δύο)."],"e":["La mi madre se llama Elena.","Mi madre se llama Elena.","Πριν από το κτητικό δεν μπαίνει άρθρο."]},{"h":"Δεικτικά","t":[["","αρσ.","θηλ.","αρσ. πληθ.","θηλ. πληθ."],["εδώ","este","esta","estos","estas"],["εκεί","ese","esa","esos","esas"],["εκεί πέρα","aquel","aquella","aquellos","aquellas"]],"ex":[["Este es mi padre.","Αυτός είναι ο πατέρας μου."],["Aquella casa es muy antigua.","Εκείνο το σπίτι είναι πολύ παλιό."],["Esta chica es mi hermana y ese chico es su novio.","Αυτή η κοπέλα (δίπλα μου) είναι η αδελφή μου και αυτό το αγόρι (εκεί) είναι το αγόρι της."],["Estos zapatos son nuevos.","Αυτά τα παπούτσια (που φοράω) είναι καινούργια."]],"i":"Τα δεικτικά είναι οι λέξεις με τις οποίες ΔΕΙΧΝΕΙΣ κάτι: «αυτός», «εκείνος». Τα ελληνικά έχουν δύο αποστάσεις, τα ισπανικά τρεις. Ποιο θα διαλέξεις εξαρτάται από το πόσο μακριά είναι αυτό που δείχνεις.","w":[["este / esta","Είναι ΚΟΝΤΑ ΣΕ ΜΕΝΑ που μιλάω: το κρατάω ή είναι δίπλα μου. «Αυτός εδώ»: [[Este libro es mío.]] Πάει με το [[aquí]] (εδώ)."],["ese / esa","Είναι ΚΟΝΤΑ ΣΕ ΣΕΝΑ που με ακούς, ή λίγο πιο πέρα από μένα. «Αυτός εκεί»: [[¿Me pasas ese libro?]] = Μου δίνεις αυτό το βιβλίο (που έχεις δίπλα σου); Πάει με το [[ahí]] (εκεί)."],["aquel / aquella","Είναι ΜΑΚΡΙΑ ΚΑΙ ΑΠΟ ΤΟΥΣ ΔΥΟ. «Εκείνος εκεί πέρα»: [[¿Ves aquella montaña?]] = Βλέπεις εκείνο το βουνό; Πάει με το [[allí]] (εκεί πέρα)."],["Για χρόνο","[[este año]] = φέτος, [[esta semana]] = αυτή την εβδομάδα. [[aquel año]] = εκείνη τη χρονιά (παλιά)."],["esto / eso","Όταν ΔΕΝ ξέρεις ή δεν λες τι είναι το πράγμα: [[¿Qué es esto?]] = Τι είναι αυτό;"]],"s":["Σκέψου πού είναι αυτό που δείχνεις: δίπλα μου → [[est-]], δίπλα σου → [[es-]], μακριά → [[aquel-]].","Κοίτα το ουσιαστικό: αρσενικό ή θηλυκό, ένα ή πολλά.","Διάλεξε την κατάληξη από τον πίνακα: [[esta casa]], [[esos chicos]], [[aquellas montañas]]."],"e":["Este chica es mi hermana.","Esta chica es mi hermana.","Το δεικτικό παίρνει το γένος του ουσιαστικού: chica είναι θηλυκό."]},{"h":"Επίθετα και ένταση","p":["Το επίθετο συμφωνεί σε γένος και αριθμό: [[simpático, simpática, simpáticos, simpáticas]]. Όσα τελειώνουν σε -e ή σύμφωνο δεν αλλάζουν στο θηλυκό, εκτός από τα -or: [[trabajador → trabajadora]].","[[muy]] + επίθετο = πολύ. [[bastante]] = αρκετά. [[un poco]] = λίγο."],"ex":[["Mi hermana es muy simpática.","Η αδελφή μου είναι πολύ συμπαθητική."],["Es un poco tímido.","Είναι λίγο ντροπαλός."]],"i":"Το επίθετο περιγράφει πώς είναι κάποιος. Μπαίνει συνήθως ΜΕΤΑ το ουσιαστικό και παίρνει το γένος και τον αριθμό του.","w":[["muy + επίθετο","«Πολύ»: [[Es muy simpático.]]"],["bastante + επίθετο","«Αρκετά»: [[Es bastante alto.]]"],["un poco + επίθετο","«Λίγο», μόνο για κάτι αρνητικό: [[Es un poco vago.]]"],["no … nada + επίθετο","«Καθόλου»: [[No es nada tímido.]]"]],"s":["Βρες το γένος του ουσιαστικού: [[la chica]] → θηλυκό.","Αν το επίθετο τελειώνει σε [[-o]], κάνε το [[-a]]: [[simpática]].","Αν είναι πολλοί, πρόσθεσε [[-s]] (ή [[-es]] μετά από σύμφωνο): [[simpáticas]], [[trabajadores]]."],"e":["Mi hermana es mucho simpático.","Mi hermana es muy simpática.","Πριν από επίθετο θέλει muy, και το επίθετο γίνεται θηλυκό."]},{"h":"Ρήματα με αλλαγή στη ρίζα","p":["Η ρίζα αλλάζει όταν πέφτει πάνω της ο τόνος: σε όλα τα πρόσωπα εκτός από nosotros και vosotros."],"t":[["","querer (e→ie)","poder (o→ue)","pedir (e→i)"],["yo","quiero","puedo","pido"],["tú","quieres","puedes","pides"],["él / ella","quiere","puede","pide"],["nosotros","queremos","podemos","pedimos"],["vosotros","queréis","podéis","pedís"],["ellos","quieren","pueden","piden"]],"tip":"Μερικά έχουν ανώμαλο «εγώ»: [[tengo, vengo, digo, hago, salgo, conozco, sé]].","i":"Μερικά πολύ συχνά ρήματα αλλάζουν ένα φωνήεν στη ρίζα τους όταν κλίνονται. Οι καταλήξεις μένουν κανονικές. Δεν φαίνεται από το απαρέμφατο ποια ρήματα το κάνουν· τα μαθαίνεις ένα ένα.","w":[["e → ie","[[querer, preferir, empezar, cerrar, pensar, entender]]: [[quiero]]."],["o → ue","[[poder, dormir, volver, costar, encontrar]]: [[puedo]]. Και [[jugar]]: [[juego]]."],["e → i","[[pedir, repetir, servir, vestirse]]: [[pido]]."]],"s":["Κλίνε το ρήμα κανονικά.","Στα [[yo, tú, él, ellos]] άλλαξε το φωνήεν της ρίζας: [[e → ie]], [[o → ue]] ή [[e → i]].","Στα [[nosotros]] και [[vosotros]] ΜΗΝ αλλάξεις τίποτα: [[queremos]], [[podéis]]."],"e":["Nosotros quieremos un café.","Nosotros queremos un café.","Στο nosotros η ρίζα δεν αλλάζει."]}],"5":[{"h":"Gustar = μου αρέσει","p":["Λειτουργεί όπως στα ελληνικά: αυτό που αρέσει ορίζει αν θα πούμε [[gusta]] ή [[gustan]]."],"t":[["","","ενικός ή απαρέμφατο","πληθυντικός"],["(a mí)","me","gusta","gustan"],["(a ti)","te","gusta","gustan"],["(a él / ella / usted)","le","gusta","gustan"],["(a nosotros)","nos","gusta","gustan"],["(a vosotros)","os","gusta","gustan"],["(a ellos / ustedes)","les","gusta","gustan"]],"ex":[["Me gusta el cine.","Μου αρέσει το σινεμά."],["Me gustan los conciertos.","Μου αρέσουν οι συναυλίες."],["¿Te gusta bailar?","Σου αρέσει να χορεύεις;"],["A Ana le gusta leer.","Στην Άννα αρέσει το διάβασμα."]],"i":"Το [[gustar]] δουλεύει ανάποδα από το «μου αρέσει» των αγγλικών και ίδια με τα ελληνικά: δεν λες «εγώ αρέσω», λες «ΜΟΥ αρέσει ο καφές». Το ρήμα κοιτάζει αυτό που αρέσει.","w":[["gusta + ένα πράγμα","[[Me gusta el café.]] Πάντα με άρθρο."],["gusta + ρήμα","[[Me gusta bailar.]] Το ρήμα μένει στο απαρέμφατο."],["gustan + πολλά πράγματα","[[Me gustan los perros.]]"],["me / te / le / nos / os / les","Δείχνουν ΣΕ ΠΟΙΟΝ αρέσει: [[te gusta]] = σου αρέσει, [[le gusta]] = του / της αρέσει."],["a mí, a ti, a Juan","Προστίθενται για έμφαση ή για να φανεί ποιος είναι: [[A Juan le gusta el fútbol.]]"]],"s":["Βάλε τη λέξη του προσώπου: [[me]] (μου), [[te]] (σου), [[le]] (του)…","Κοίτα τι αρέσει: ένα πράγμα ή ρήμα → [[gusta]], πολλά → [[gustan]].","Βάλε άρθρο πριν από το ουσιαστικό: [[Me gusta la música.]]"],"e":["Yo gusto el café.","Me gusta el café.","Δεν λέμε yo gusto. Λέμε «μου αρέσει»: me gusta."]},{"h":"Συμφωνώ και διαφωνώ","t":[["Λέει ο άλλος","Συμφωνώ","Διαφωνώ"],["Me gusta el fútbol.","A mí también.","A mí no."],["No me gusta el café.","A mí tampoco.","A mí sí."]],"i":"Πώς λες «κι εμένα», «ούτε εμένα», «εμένα ναι», «εμένα όχι» όταν κάποιος σου λέει τι του αρέσει.","w":[["A mí también","Ο άλλος λέει κάτι ΘΕΤΙΚΟ και ΣΥΜΦΩΝΕΙΣ: «Κι εμένα»."],["A mí tampoco","Ο άλλος λέει κάτι ΑΡΝΗΤΙΚΟ και ΣΥΜΦΩΝΕΙΣ: «Ούτε εμένα»."],["A mí no","Ο άλλος λέει κάτι θετικό και ΔΙΑΦΩΝΕΙΣ: «Εμένα όχι»."],["A mí sí","Ο άλλος λέει κάτι αρνητικό και ΔΙΑΦΩΝΕΙΣ: «Εμένα ναι»."],["Yo también / Yo tampoco","Με τα κανονικά ρήματα (όχι gustar): [[–Hablo inglés. –Yo también.]]"]],"e":["–Me gusta el cine. –Yo también.","–Me gusta el cine. –A mí también.","Με το gustar απαντάς με a mí, όχι με yo."]},{"h":"Ir: πού πάω και πώς","p":["[[ir a]] + μέρος. Μέσο μεταφοράς με [[en]], αλλά [[a pie]] (με τα πόδια). [[ir a]] + απαρέμφατο = θα κάνω κάτι."],"t":[["","ir"],["yo","voy"],["tú","vas"],["él / ella","va"],["nosotros","vamos"],["vosotros","vais"],["ellos","van"]],"ex":[["Voy al cine en autobús.","Πάω σινεμά με το λεωφορείο."],["Mañana voy a estudiar.","Αύριο θα διαβάσω."]],"i":"Το [[ir]] (πηγαίνω) είναι ανώμαλο και το χρειάζεσαι για τρία πράγματα: πού πας, με τι πας και τι σκοπεύεις να κάνεις.","w":[["ir a + μέρος","ΠΟΥ πας: [[Voy a la playa.]] · [[Voy al cine.]]"],["ir en + μέσο","ΜΕ ΤΙ πας: [[Voy en coche / en metro / en autobús.]] Εξαίρεση: [[a pie]] = με τα πόδια."],["ir a + απαρέμφατο","Τι ΘΑ κάνεις: [[Voy a estudiar.]] = Θα διαβάσω."],["ir de + δραστηριότητα","[[ir de compras]] = πάω για ψώνια."]],"e":["Voy en la playa.","Voy a la playa.","Το en είναι για το μέσο. Ο προορισμός θέλει a."]},{"h":"Estar + gerundio: τώρα","p":["Για κάτι που γίνεται αυτή τη στιγμή. -ar → [[-ando]], -er/-ir → [[-iendo]]."],"ex":[["Estoy comiendo.","Τρώω (τώρα)."],["Está leyendo un libro.","Διαβάζει ένα βιβλίο."]],"tip":"Ανώμαλα: [[leer → leyendo]], [[dormir → durmiendo]], [[decir → diciendo]], [[ir → yendo]].","i":"Για κάτι που γίνεται ΑΥΤΗ ΤΗ ΣΤΙΓΜΗ, τα ισπανικά έχουν ειδικό τύπο, όπως το αγγλικό «I am working».","w":[["trabajo","Απλός ενεστώτας: τι κάνω ΓΕΝΙΚΑ: [[Trabajo en un banco.]]"],["estoy trabajando","Τι κάνω ΤΩΡΑ: [[Ahora no puedo, estoy trabajando.]]"]],"s":["Κλίνε το [[estar]]: [[estoy, estás, está…]]","Πάρε το ρήμα, κόψε την κατάληξη και βάλε [[-ando]] (για -ar) ή [[-iendo]] (για -er, -ir): [[trabajar → trabajando]].","Το δεύτερο κομμάτι ΔΕΝ αλλάζει ποτέ: [[estamos comiendo]]."],"e":["Soy trabajando.","Estoy trabajando.","Πάντα με estar, ποτέ με ser."]},{"h":"Ανώμαλα: hacer, salir, preferir, poder","t":[["","hacer","salir","preferir","poder"],["yo","hago","salgo","prefiero","puedo"],["tú","haces","sales","prefieres","puedes"],["él / ella","hace","sale","prefiere","puede"],["nosotros","hacemos","salimos","preferimos","podemos"]],"i":"Τέσσερα πολύ συχνά ρήματα που δεν ακολουθούν ακριβώς τον κανόνα.","w":[["hacer, salir","Ανώμαλο ΜΟΝΟ το «εγώ»: [[hago]], [[salgo]]. Τα υπόλοιπα πρόσωπα είναι κανονικά."],["preferir","[[e → ie]]: [[prefiero]]. Μετά βάζεις ουσιαστικό ή απαρέμφατο: [[Prefiero el té.]] · [[Prefiero salir.]]"],["poder","[[o → ue]]: [[puedo]]. Μετά πάντα απαρέμφατο: [[No puedo ir.]]"]],"e":["Yo haco deporte.","Yo hago deporte.","Το «εγώ» του hacer είναι hago."]}],"6":[{"h":"Χρώματα","p":["Συμφωνούν με το ουσιαστικό όπως τα επίθετα: [[rojo, roja, rojos, rojas]]. Όσα τελειώνουν σε -e ή σύμφωνο αλλάζουν μόνο στον πληθυντικό: [[verde → verdes]], [[azul → azules]]. Τα [[naranja]] και [[rosa]] μένουν ίδια στο γένος."],"ex":[["Una camisa blanca y unos zapatos negros.","Ένα άσπρο πουκάμισο και μαύρα παπούτσια."]],"i":"Τα χρώματα είναι επίθετα: μπαίνουν ΜΕΤΑ το ουσιαστικό και συμφωνούν μαζί του.","w":[["Σε -o","Τέσσερις μορφές: [[rojo, roja, rojos, rojas]]."],["Σε -e ή σύμφωνο","Αλλάζουν μόνο στον πληθυντικό: [[verde, verdes]] · [[azul, azules]]."],["naranja, rosa","Δεν αλλάζουν γένος: [[un jersey rosa]]."]],"e":["Tengo una roja camisa.","Tengo una camisa roja.","Το χρώμα μπαίνει μετά το ουσιαστικό."]},{"h":"Περιγραφή: ser, tener, llevar","t":[["Ρήμα","Για τι","Παράδειγμα"],["ser","σώμα, χαρακτήρας","Es alto y delgado."],["tener","μάτια, μαλλιά","Tiene los ojos verdes."],["llevar","ρούχα, γυαλιά, γένια","Lleva gafas y una chaqueta."]],"tip":"[[el pelo]] είναι αρσενικό και ενικός: [[Tiene el pelo rubio.]]","i":"Για να περιγράψεις έναν άνθρωπο χρειάζεσαι τρία ρήματα, το καθένα για άλλο πράγμα.","w":[["ser + επίθετο","ΠΩΣ ΕΙΝΑΙ γενικά: [[Es alta, delgada y rubia.]]"],["tener + μέρος του σώματος","ΤΙ ΕΧΕΙ: [[Tiene los ojos azules y el pelo largo.]] Με άρθρο."],["llevar + κάτι πάνω του","ΤΙ ΦΟΡΑΕΙ ή τι «κουβαλάει»: [[Lleva gafas, barba y una camisa blanca.]]"]],"e":["Es los ojos azules.","Tiene los ojos azules.","Τα μάτια τα «έχεις»: tener."]},{"h":"Υποχρέωση και ανάγκη","p":["[[tener que]] + απαρέμφατο = πρέπει. [[deber]] + απαρέμφατο = οφείλω, καλό είναι να. [[necesitar]] + ουσιαστικό ή απαρέμφατο = χρειάζομαι."],"ex":[["Tengo que trabajar.","Πρέπει να δουλέψω."],["Debes descansar.","Πρέπει να ξεκουραστείς."],["Necesito un abrigo.","Χρειάζομαι ένα παλτό."]],"i":"Τέσσερις τρόποι να πεις «πρέπει» ή «χρειάζεται».","w":[["tener que + απαρέμφατο","«Πρέπει», συγκεκριμένη υποχρέωση για κάποιον: [[Tengo que trabajar mañana.]]"],["deber + απαρέμφατο","«Οφείλω, καλό είναι να», πιο πολύ συμβουλή: [[Debes descansar.]]"],["necesitar + ουσιαστικό ή απαρέμφατο","«Χρειάζομαι»: [[Necesito un abrigo.]]"],["hay que + απαρέμφατο","«Πρέπει» ΓΕΝΙΚΑ, για όλους: [[Hay que pagar en caja.]]"]],"e":["Tengo estudiar.","Tengo que estudiar.","Το que δεν παραλείπεται."]},{"h":"Ο καιρός","t":[["Ισπανικά","Ελληνικά"],["Hace frío / calor","Κάνει κρύο / ζέστη"],["Hace sol / viento","Έχει ήλιο / Φυσάει"],["Llueve","Βρέχει"],["Nieva","Χιονίζει"],["Está nublado","Έχει συννεφιά"]],"p":["Εποχές: [[la primavera, el verano, el otoño, el invierno]]. Με μήνες και εποχές βάζουμε [[en]]: [[en mayo, en verano]]."],"i":"Για τον καιρό τα ισπανικά λένε «κάνει», όπως κι εμείς: κάνει κρύο, κάνει ζέστη.","w":[["hace + ουσιαστικό","[[Hace calor, frío, sol, viento, buen tiempo.]]"],["llueve, nieva","Ρήματα μόνα τους: [[Llueve mucho.]] = Βρέχει πολύ."],["está + επίθετο","[[Está nublado.]] = Έχει συννεφιά."],["hay + ουσιαστικό","[[Hay niebla, tormenta.]] = Έχει ομίχλη, καταιγίδα."]],"e":["Es calor.","Hace calor.","Η ζέστη και το κρύο λέγονται με hace."]},{"h":"Αριθμοί 100–1000","p":["100 = [[cien]], αλλά 101–199 = [[ciento …]]: [[ciento cincuenta]]. Οι εκατοντάδες συμφωνούν στο γένος: [[doscientos euros, doscientas personas]].","200 [[doscientos]], 300 [[trescientos]], 400 [[cuatrocientos]], 500 [[quinientos]], 600 [[seiscientos]], 700 [[setecientos]], 800 [[ochocientos]], 900 [[novecientos]], 1000 [[mil]]."],"i":"Οι αριθμοί από το 100 και πάνω, για τιμές και χρονολογίες.","w":[["cien","Ακριβώς 100: [[cien euros]]."],["ciento","Από 101 έως 199: [[ciento veinte]]."],["y","Μπαίνει ΜΟΝΟ ανάμεσα σε δεκάδες και μονάδες: [[treinta y cinco]]. Όχι μετά τις εκατοντάδες: [[ciento cinco]]."],["-cientos / -cientas","Συμφωνούν με το ουσιαστικό: [[doscientas personas]]."]],"e":["ciento y cinco","ciento cinco","Μετά το ciento δεν μπαίνει y."]}],"7":[{"h":"Es bueno + απαρέμφατο","p":["Γενικές συμβουλές: [[es bueno / es malo / es necesario / es importante]] + απαρέμφατο."],"ex":[["Es bueno beber agua.","Είναι καλό να πίνεις νερό."],["Es malo comer mucho azúcar.","Είναι κακό να τρως πολλή ζάχαρη."]],"i":"Για να δώσεις μια γενική συμβουλή που ισχύει για όλους: «είναι καλό να…».","w":[["es bueno / malo / importante + απαρέμφατο","ΓΕΝΙΚΑ, για όλους: [[Es bueno comer fruta.]]"],["tienes que / debes + απαρέμφατο","Για ΣΥΓΚΕΚΡΙΜΕΝΟ άνθρωπο: [[Tienes que comer más fruta.]]"]],"e":["Es bueno come fruta.","Es bueno comer fruta.","Μετά το es bueno το ρήμα μένει στο απαρέμφατο."]},{"h":"Ανώμαλα ρήματα της ρουτίνας","t":[["","acostarse (o→ue)","vestirse (e→i)","reírse","dar"],["yo","me acuesto","me visto","me río","doy"],["tú","te acuestas","te vistes","te ríes","das"],["él / ella","se acuesta","se viste","se ríe","da"],["nosotros","nos acostamos","nos vestimos","nos reímos","damos"],["vosotros","os acostáis","os vestís","os reís","dais"],["ellos","se acuestan","se visten","se ríen","dan"]],"i":"Ρήματα της καθημερινής ρουτίνας που αλλάζουν ρίζα (όπως στο κεφάλαιο 4) και είναι και αυτοπαθή (όπως στο κεφάλαιο 2). Συνδυάζεις τους δύο κανόνες.","s":["Βάλε μπροστά το [[me, te, se…]]","Άλλαξε το φωνήεν στα [[yo, tú, él, ellos]]: [[acostarse → me acuesto]].","Στα [[nosotros, vosotros]] κράτα την κανονική ρίζα: [[nos acostamos]]."],"e":["Me acosto a las once.","Me acuesto a las once.","Το acostarse αλλάζει o → ue."]},{"h":"Ποσότητα: mucho, bastante, poco, nada","p":["Με ουσιαστικό συμφωνούν: [[mucho pan, mucha agua, muchos huevos, muchas verduras]]. Με ρήμα μένουν ίδια: [[Como mucho.]] Με επίθετο λέμε [[muy]]: [[muy sano]].","[[no … nada]] = καθόλου: [[No como nada de carne.]]"],"tip":"[[el agua]] παίρνει el, αλλά είναι θηλυκό: [[mucha agua]].","i":"Πώς λες πόσο: πολύ, αρκετά, λίγο, καθόλου. Το δύσκολο είναι ότι το «πολύ» έχει δύο λέξεις, [[muy]] και [[mucho]].","w":[["muy + επίθετο","[[muy sano]] = πολύ υγιεινό. Δεν αλλάζει ποτέ."],["mucho/a/os/as + ουσιαστικό","Συμφωνεί: [[mucho pan, mucha fruta, muchos huevos, muchas verduras]]."],["ρήμα + mucho","Δεν αλλάζει: [[Como mucho.]] = Τρώω πολύ."],["poco, bastante, demasiado","Λειτουργούν όπως το mucho: [[poca sal]], [[bastantes verduras]]."],["no … nada","«Καθόλου»: [[No bebo nada de alcohol.]]"]],"e":["Es mucho bueno.","Es muy bueno.","Πριν από επίθετο μπαίνει muy."]},{"h":"Στο εστιατόριο","ex":[["De primero, ensalada.","Για πρώτο πιάτο, σαλάτα."],["De segundo, pescado.","Για δεύτερο, ψάρι."],["De postre, fruta.","Για επιδόρπιο, φρούτα."],["La cuenta, por favor.","Τον λογαριασμό, παρακαλώ."]],"p":["Σύνδεσμοι: [[y]] = και, [[pero]] = αλλά, [[o]] = ή."],"i":"Οι φράσεις που χρειάζεσαι για να παραγγείλεις.","w":[["de primero / de segundo / de postre","Για πρώτο πιάτο / για κύριο / για επιδόρπιο."],["para mí","«Για μένα»: [[Para mí, una ensalada.]]"],["quería / quiero","[[Quería]] (θα ήθελα) είναι πιο ευγενικό από το [[quiero]] (θέλω)."],["¿Me trae…? / ¿Nos trae…?","«Μου / μας φέρνετε…;»: [[¿Me trae la cuenta, por favor?]]"]]}],"8":[{"h":"Παρακείμενος: haber + μετοχή","p":["Για εμπειρίες και για ό,τι έγινε σε χρόνο που δεν έχει τελειώσει (σήμερα, αυτή την εβδομάδα). Μετοχή: -ar → [[-ado]], -er/-ir → [[-ido]]."],"t":[["","haber","+ μετοχή"],["yo","he","hablado"],["tú","has","comido"],["él / ella","ha","vivido"],["nosotros","hemos","viajado"],["vosotros","habéis","estado"],["ellos","han","tenido"]],"ex":[["He estado en México.","Έχω πάει στο Μεξικό."],["¿Has visto esta película?","Έχεις δει αυτή την ταινία;"]],"tip":"Τα [[he]] και η μετοχή δεν χωρίζονται ποτέ: [[Me he levantado]], [[No he comido]].","i":"Ο παρακείμενος λέει τι ΕΧΕΙΣ ΚΑΝΕΙ. Φτιάχνεται από δύο κομμάτια, όπως το ελληνικό «έχω φάει».","w":[["Εμπειρίες ζωής","Χωρίς να λες πότε: [[He estado en México.]]"],["Σήμερα, αυτή την εβδομάδα, φέτος","Ο χρόνος δεν έχει τελειώσει ακόμα: [[Hoy he trabajado mucho.]]"],["ya / todavía no","«Ήδη» / «ακόμα δεν»: [[Ya he comido.]] · [[Todavía no he terminado.]]"]],"s":["Κλίνε το [[haber]]: [[he, has, ha, hemos, habéis, han]].","Πάρε το ρήμα, κόψε την κατάληξη και βάλε [[-ado]] (για -ar) ή [[-ido]] (για -er, -ir): [[hablar → hablado]], [[comer → comido]].","Η μετοχή ΔΕΝ αλλάζει ποτέ: [[Ella ha comido.]] · [[Ellos han comido.]]"],"e":["Yo ha comido.","Yo he comido.","Το «εγώ» του haber είναι he."]},{"h":"Ανώμαλες μετοχές","t":[["Ρήμα","Μετοχή"],["hacer","hecho"],["ver","visto"],["escribir","escrito"],["decir","dicho"],["poner","puesto"],["volver","vuelto"],["abrir","abierto"],["romper","roto"]],"i":"Λίγα συχνά ρήματα δεν παίρνουν [[-ado / -ido]] αλλά έχουν δική τους μετοχή. Πρέπει να τα αποστηθίσεις.","e":["He hacido los deberes.","He hecho los deberes.","Η μετοχή του hacer είναι hecho."],"ex":[["¿Qué has hecho hoy?","Τι έκανες σήμερα;"],["He visto una película.","Είδα μια ταινία."],["Todavía no he escrito el correo.","Δεν έχω γράψει ακόμα το email."]]},{"h":"Λέξεις που πάνε με τον παρακείμενο","p":["[[hoy, esta mañana, esta semana, este año, alguna vez, nunca, ya, todavía no]]."],"ex":[["¿Has estado alguna vez en España?","Έχεις πάει ποτέ στην Ισπανία;"],["Nunca he comido paella.","Δεν έχω φάει ποτέ παέγια."],["Todavía no he terminado.","Δεν έχω τελειώσει ακόμα."]],"i":"Κάποιες λέξεις σού «φωνάζουν» ότι θέλει παρακείμενο, γιατί δείχνουν χρόνο που φτάνει μέχρι τώρα.","w":[["hoy, esta mañana, esta semana, este año","Ο χρόνος δεν έχει κλείσει ακόμα."],["alguna vez","«Ποτέ» σε ερώτηση: [[¿Has comido paella alguna vez?]]"],["nunca","«Ποτέ» σε άρνηση: [[Nunca he estado en Cuba.]]"],["ya","«Ήδη»: [[Ya he terminado.]]"],["todavía no","«Ακόμα δεν»: [[Todavía no he comido.]]"]]},{"h":"Hace, desde, desde hace","t":[["","Ακολουθεί","Παράδειγμα"],["desde","χρονικό σημείο","Vivo aquí desde 2020."],["desde hace","διάστημα","Estudio español desde hace dos meses."],["hace … que","διάστημα","Hace dos meses que estudio español."]],"i":"Τρεις τρόποι να πεις από πότε ή εδώ και πόσον καιρό κάνεις κάτι. Προσοχή: στα ισπανικά το ρήμα μπαίνει στον ΕΝΕΣΤΩΤΑ, όπως στα ελληνικά («μένω εδώ από το 2020»).","w":[["desde + σημείο","Από ΠΟΤΕ ξεκίνησε: [[desde 2020]], [[desde enero]], [[desde el lunes]]."],["desde hace + διάστημα","ΕΔΩ ΚΑΙ πόσον καιρό: [[desde hace dos años]]."],["hace + διάστημα + que","Το ίδιο, με άλλη σειρά: [[Hace dos años que vivo aquí.]]"],["hace + διάστημα (με αόριστο)","«ΠΡΙΝ ΑΠΟ»: [[Llegué hace dos años.]] = Ήρθα πριν από δύο χρόνια."]],"e":["Vivo aquí desde dos años.","Vivo aquí desde hace dos años.","Με διάστημα (δύο χρόνια) θέλει desde hace."]}],"9":[{"h":"Doler = πονάει","p":["Κλίνεται όπως το gustar: [[me duele]] + ενικός, [[me duelen]] + πληθυντικός."],"ex":[["Me duele la cabeza.","Πονάει το κεφάλι μου."],["Me duelen los pies.","Πονάνε τα πόδια μου."],["¿Te duele la garganta?","Σε πονάει ο λαιμός σου;"],["A mi madre le duele la espalda.","Τη μητέρα μου την πονάει η πλάτη."]],"tip":"Στα μέρη του σώματος μπαίνει άρθρο, όχι κτητικό: [[Me duele la cabeza]], όχι «mi cabeza».","i":"Το [[doler]] (πονάει) δουλεύει ακριβώς όπως το [[gustar]] και όπως στα ελληνικά: «ΜΕ πονάει το κεφάλι».","w":[["me duele + ένα μέρος","[[Me duele la cabeza.]]"],["me duelen + πολλά","[[Me duelen los pies.]]"],["te / le / nos…","Αλλάζεις τη μικρή λέξη για το ποιον πονάει: [[¿Te duele?]] · [[Le duele la espalda.]]"]],"e":["Me duele mi cabeza.","Me duele la cabeza.","Στα μέρη του σώματος μπαίνει άρθρο. Το me δείχνει ήδη ότι είναι το δικό σου."]},{"h":"Tener και estar για την υγεία","t":[["tener + ουσιαστικό","estar + επίθετο"],["tener fiebre (πυρετό)","estar enfermo/a (άρρωστος)"],["tener tos (βήχα)","estar resfriado/a (κρυωμένος)"],["tener dolor de cabeza","estar cansado/a (κουρασμένος)"],["tener gripe (γρίπη)","estar mareado/a (ζαλισμένος)"]],"ex":[["¿Qué te pasa? – Me encuentro mal.","Τι έχεις; – Αισθάνομαι άσχημα."]],"i":"Για την υγεία: με το [[tener]] λες τι ΕΧΕΙΣ (ουσιαστικό) και με το [[estar]] λες ΠΩΣ ΕΙΣΑΙ (επίθετο).","w":[["tener + ουσιαστικό","[[Tengo fiebre, tos, gripe, dolor de cabeza.]]"],["estar + επίθετο","[[Estoy enfermo, cansado, resfriado.]] Το επίθετο συμφωνεί: [[Ella está enferma.]]"]],"e":["Estoy fiebre.","Tengo fiebre.","Ο πυρετός είναι ουσιαστικό: τον «έχεις»."]},{"h":"Συμβουλές","p":["[[deber / tener que / poder]] + απαρέμφατο."],"ex":[["Debes ir al médico.","Πρέπει να πας στον γιατρό."],["Tienes que descansar.","Πρέπει να ξεκουραστείς."],["Puedes tomar una infusión.","Μπορείς να πιεις ένα τσάι βοτάνων."]],"i":"Τρεις τρόποι να δώσεις συμβουλή, από τον πιο δυνατό στον πιο ήπιο.","w":[["tienes que + απαρέμφατο","ΠΡΕΠΕΙ, είναι ανάγκη: [[Tienes que ir al médico.]]"],["debes + απαρέμφατο","ΚΑΛΟ ΕΙΝΑΙ να: [[Debes descansar.]]"],["puedes + απαρέμφατο","ΜΠΟΡΕΙΣ να, απλή πρόταση: [[Puedes tomar un té.]]"]],"e":["Debes de descansas.","Debes descansar.","Μετά το deber το ρήμα μένει στο απαρέμφατο."]},{"h":"Υποθέσεις και σύνδεσμοι","p":["[[a lo mejor]] + οριστική = ίσως. Σύνδεσμοι: [[y]] (και), [[pero]] (αλλά), [[porque]] (επειδή), [[por eso]] (γι' αυτό)."],"ex":[["A lo mejor tienes gripe.","Μπορεί να έχεις γρίπη."],["Estoy enfermo, por eso no voy a clase.","Είμαι άρρωστος, γι' αυτό δεν πάω στο μάθημα."]],"tip":"Λέξεις σε -ma είναι συχνά αρσενικές: [[el problema, el síntoma, el tema]].","i":"Μικρές λέξεις που ενώνουν προτάσεις και μια φράση για να κάνεις υποθέσεις.","w":[["a lo mejor","«Ίσως»: [[A lo mejor tienes gripe.]]"],["porque","Δίνει την ΑΙΤΙΑ: [[No voy porque estoy enfermo.]]"],["por eso","Δίνει το ΑΠΟΤΕΛΕΣΜΑ: [[Estoy enfermo, por eso no voy.]]"],["pero","«Αλλά»: [[Estoy cansado, pero voy a trabajar.]]"]]}],"10":[{"h":"Συγκριτικά","t":[["","Τύπος","Παράδειγμα"],["περισσότερο","más … que","Madrid es más grande que Sevilla."],["λιγότερο","menos … que","Es menos caro que el otro."],["το ίδιο","tan … como","Es tan alto como su padre."]],"tip":"Ανώμαλα: [[bueno → mejor]], [[malo → peor]], [[grande (ηλικία) → mayor]], [[pequeño (ηλικία) → menor]].","i":"Για να συγκρίνεις δύο πράγματα: πιο, λιγότερο, το ίδιο.","w":[["más + επίθετο + que","«Πιο … από»: [[Atenas es más grande que Tesalónica.]]"],["menos + επίθετο + que","«Λιγότερο … από»: [[Es menos caro que el otro.]]"],["tan + επίθετο + como","«Τόσο … όσο»: [[Es tan alto como yo.]]"],["mejor / peor","«Καλύτερος / χειρότερος». Δεν λέμε «más bueno»."],["mayor / menor","«Μεγαλύτερος / μικρότερος» σε ΗΛΙΚΙΑ: [[Mi hermano es mayor que yo.]]"]],"e":["Es más grande de mi casa.","Es más grande que mi casa.","Το «από» στη σύγκριση είναι que."]},{"h":"Υπερθετικός","p":["[[el / la / los / las]] + [[más]] + επίθετο + [[de]]."],"ex":[["Es la montaña más alta de España.","Είναι το ψηλότερο βουνό της Ισπανίας."],["Es el mejor restaurante de la ciudad.","Είναι το καλύτερο εστιατόριο της πόλης."]],"i":"Για να πεις «ο πιο … από όλους».","s":["Βάλε το άρθρο: [[el, la, los, las]].","Μετά [[más]] + το επίθετο: [[la más grande]].","Το «από όλους» ή «της χώρας» λέγεται με [[de]]: [[la ciudad más grande de España]]."],"e":["Es el más alto en la clase.","Es el más alto de la clase.","Μετά τον υπερθετικό θέλει de."]},{"h":"Αντωνυμίες αντικειμένου: lo, la, los, las","p":["Αντικαθιστούν κάτι που έχουμε ήδη πει και μπαίνουν πριν από το ρήμα."],"t":[["","ενικός","πληθυντικός"],["αρσενικό","lo","los"],["θηλυκό","la","las"]],"ex":[["¿Tienes el mapa? – Sí, lo tengo.","Έχεις τον χάρτη; – Ναι, τον έχω."],["¿Reciclas las botellas? – Sí, las reciclo.","Ανακυκλώνεις τα μπουκάλια; – Ναι, τα ανακυκλώνω."],["–¿Conoces a Pedro? –Sí, lo conozco.","–Ξέρεις τον Πέδρο; –Ναι, τον ξέρω."],["–¿Tienes las llaves? –No, no las tengo.","–Έχεις τα κλειδιά; –Όχι, δεν τα έχω."]],"i":"Όταν δεν θέλεις να επαναλάβεις ένα ουσιαστικό, το αντικαθιστάς με [[lo, la, los, las]], όπως στα ελληνικά «το», «την», «τους».","s":["Βρες το γένος και τον αριθμό αυτού που αντικαθιστάς: [[la paella]] → [[la]].","Βάλε την αντωνυμία ΠΡΙΝ από το κλιμένο ρήμα: [[La como.]] = Την τρώω.","Αν υπάρχει άρνηση, το [[no]] πάει πρώτο: [[No la como.]]"],"e":["Como la.","La como.","Η αντωνυμία μπαίνει πριν από το ρήμα."]},{"h":"Κλίμα και τοπίο","p":["[[el clima es seco / húmedo / lluvioso / caluroso]]. Τοπίο: [[la montaña, el río, el lago, la playa, la isla, el desierto, el bosque]]."],"ex":[["En el norte llueve mucho.","Στον βορρά βρέχει πολύ."],["En verano hace mucho calor.","Το καλοκαίρι κάνει πολλή ζέστη."]],"i":"Λέξεις για να περιγράψεις έναν τόπο.","w":[["El clima es + επίθετο","[[El clima es seco.]] = Το κλίμα είναι ξηρό."],["Hay + τοπίο","[[Hay montañas y lagos.]]"],["Está en + θέση","[[Está en el norte / sur / este / oeste.]]"]]}],"11":[{"h":"Αόριστος ομαλών ρημάτων","p":["Για κάτι που έγινε και τελείωσε σε συγκεκριμένο χρόνο στο παρελθόν."],"t":[["","trabajar","comer","vivir"],["yo","trabajé","comí","viví"],["tú","trabajaste","comiste","viviste"],["él / ella","trabajó","comió","vivió"],["nosotros","trabajamos","comimos","vivimos"],["vosotros","trabajasteis","comisteis","vivisteis"],["ellos","trabajaron","comieron","vivieron"]],"tip":"Ο τόνος αλλάζει το νόημα: [[trabajo]] = δουλεύω, [[trabajó]] = δούλεψε.","i":"Ο αόριστος λέει τι ΕΚΑΝΕΣ: μια πράξη που έγινε και ΤΕΛΕΙΩΣΕ σε συγκεκριμένη στιγμή του παρελθόντος (χθες, πέρσι, το 2015).","w":[["ayer, anoche, el lunes","Χθες, χθες βράδυ, τη Δευτέρα."],["la semana pasada, el año pasado","Την περασμένη εβδομάδα, πέρσι."],["en 2015, hace dos años","Το 2015, πριν από δύο χρόνια."]],"s":["Κόψε την κατάληξη: [[trabajar → trabaj-]].","Βάλε την κατάληξη του αορίστου από τον πίνακα: [[trabajé]] (δούλεψα).","Πρόσεξε τον τόνο στο «εγώ» και στο «αυτός»: [[trabajé]], [[trabajó]]."],"e":["Ayer he trabajado mucho.","Ayer trabajé mucho.","Το ayer (χθες) είναι χρόνος που έχει τελειώσει: θέλει αόριστο."]},{"h":"Ανώμαλοι: ir/ser, estar, tener, hacer","t":[["","ir / ser","estar","tener","hacer"],["yo","fui","estuve","tuve","hice"],["tú","fuiste","estuviste","tuviste","hiciste"],["él / ella","fue","estuvo","tuvo","hizo"],["nosotros","fuimos","estuvimos","tuvimos","hicimos"],["vosotros","fuisteis","estuvisteis","tuvisteis","hicisteis"],["ellos","fueron","estuvieron","tuvieron","hicieron"]],"tip":"Το [[ir]] και το [[ser]] έχουν τον ίδιο αόριστο: [[fui]] = πήγα ή ήμουν.","i":"Τα πιο συχνά ρήματα έχουν ανώμαλο αόριστο. Έχουν δική τους ρίζα και καταλήξεις ΧΩΡΙΣ τόνο.","w":[["fui","«Πήγα» ΚΑΙ «ήμουν». Από τα συμφραζόμενα καταλαβαίνεις: [[Fui a Madrid.]] (πήγα) · [[Fue un día genial.]] (ήταν)."],["estuve","«Ήμουν / βρέθηκα» κάπου: [[Estuve en casa.]]"],["tuve","«Είχα»: [[Tuve un problema.]]"],["hice","«Έκανα». Στο «αυτός» γράφεται με z: [[hizo]]."]],"e":["Ayer yo fue al cine.","Ayer fui al cine.","Το «εγώ» είναι fui. Το fue είναι για «αυτός»."]},{"h":"Ορθογραφία στο «εγώ»","p":["-car → [[-qué]]: [[buscar → busqué]]. -gar → [[-gué]]: [[jugar → jugué]]. -zar → [[-cé]]: [[empezar → empecé]]."],"i":"Μια αλλαγή μόνο στην ορθογραφία, για να μείνει ίδιος ο ήχος. Συμβαίνει ΜΟΝΟ στο «εγώ» του αορίστου.","w":[["-car → -qué","[[buscar → busqué]], [[tocar → toqué]]. Με c θα διαβαζόταν «θε»."],["-gar → -gué","[[llegar → llegué]], [[jugar → jugué]]."],["-zar → -cé","[[empezar → empecé]]."]],"e":["Yo llegé tarde.","Yo llegué tarde.","Χωρίς το u θα διαβαζόταν «γιεχέ»."]},{"h":"Παρακείμενος ή αόριστος;","t":[["Παρακείμενος (he comido)","Αόριστος (comí)"],["hoy, esta semana, este año","ayer, anoche, la semana pasada"],["alguna vez, nunca, ya","el año pasado, en 2015, hace dos años"]],"ex":[["Hoy he comido paella.","Σήμερα έφαγα παέγια."],["Ayer comí paella.","Χθες έφαγα παέγια."],["Empecé a trabajar hace tres años.","Άρχισα να δουλεύω πριν από τρία χρόνια."]],"i":"Και οι δύο χρόνοι μιλούν για το παρελθόν. Η διαφορά είναι αν ο χρόνος που αναφέρεις έχει ΤΕΛΕΙΩΣΕΙ ή όχι.","w":[["Παρακείμενος: he comido","Ο χρόνος ΔΕΝ έχει τελειώσει (σήμερα, αυτή την εβδομάδα, φέτος) ή δεν λες καθόλου πότε (εμπειρία): [[Hoy he comido paella.]]"],["Αόριστος: comí","Ο χρόνος ΕΧΕΙ τελειώσει (χθες, πέρσι, το 2015): [[Ayer comí paella.]]"]],"s":["Βρες τη χρονική λέξη στην πρόταση.","Ρώτα: είμαστε ακόμα μέσα σε αυτόν τον χρόνο; (σήμερα → ναι, χθες → όχι).","Ναι → παρακείμενος. Όχι → αόριστος."],"e":["El año pasado he viajado a Italia.","El año pasado viajé a Italia.","Η περσινή χρονιά έχει τελειώσει: αόριστος."]}],"12":[{"h":"Ανώμαλοι αόριστοι","p":["Αλλάζει η ρίζα και οι καταλήξεις είναι χωρίς τόνο: [[-e, -iste, -o, -imos, -isteis, -ieron]]."],"t":[["Ρήμα","Ρίζα","yo","él / ella"],["poder","pud-","pude","pudo"],["poner","pus-","puse","puso"],["querer","quis-","quise","quiso"],["saber","sup-","supe","supo"],["venir","vin-","vine","vino"],["decir","dij-","dije","dijo"],["traer","traj-","traje","trajo"]],"tip":"Τα [[decir]] και [[traer]] χάνουν το i στο ellos: [[dijeron, trajeron]].","i":"Κι άλλα ρήματα με ανώμαλο αόριστο. Όλα ακολουθούν το ίδιο μοτίβο: νέα ρίζα + οι ίδιες καταλήξεις χωρίς τόνο.","s":["Μάθε τη νέα ρίζα του ρήματος: [[poder → pud-]].","Πρόσθεσε τις καταλήξεις [[-e, -iste, -o, -imos, -isteis, -ieron]].","Κανένας τόνος πουθενά: [[pude]], [[pudo]]."],"e":["Ayer no podí ir.","Ayer no pude ir.","Το poder έχει ανώμαλη ρίζα στον αόριστο: pud-."]},{"h":"Dormir, pedir, dar, ver","p":["Στα [[dormir]] και [[pedir]] η ρίζα αλλάζει μόνο στο τρίτο πρόσωπο: [[durmió, durmieron]], [[pidió, pidieron]].","[[dar]]: di, diste, dio, dimos, disteis, dieron. [[ver]]: vi, viste, vio, vimos, visteis, vieron."],"i":"Τέσσερα ακόμη συχνά ρήματα με μικρές ιδιαιτερότητες στον αόριστο.","w":[["dormir, pedir","Αλλάζουν ΜΟΝΟ στο «αυτός» και στο «αυτοί»: [[durmió]], [[pidieron]]. Τα άλλα πρόσωπα είναι κανονικά: [[dormí]], [[pedí]]."],["dar, ver","Κοντά και χωρίς τόνο: [[di, dio]] · [[vi, vio]]."]],"e":["Él dormió ocho horas.","Él durmió ocho horas.","Στο τρίτο πρόσωπο το o γίνεται u."]},{"h":"Κτητικά τονισμένα: δικός μου","t":[["","αρσ.","θηλ.","αρσ. πληθ.","θηλ. πληθ."],["δικός μου","mío","mía","míos","mías"],["δικός σου","tuyo","tuya","tuyos","tuyas"],["δικός του / της / τους","suyo","suya","suyos","suyas"],["δικός μας","nuestro","nuestra","nuestros","nuestras"]],"ex":[["¿Es tuya esta mochila? – Sí, es mía.","Είναι δικό σου αυτό το σακίδιο; – Ναι, είναι δικό μου."]],"i":"Όταν θέλεις να πεις «δικός μου» χωρίς να ακολουθεί ουσιαστικό, ή «ένας φίλος μου».","w":[["mi (πριν από ουσιαστικό)","[[Es mi libro.]] = Είναι το βιβλίο μου."],["mío (μόνο του)","[[Es mío.]] = Είναι δικό μου. · [[–¿De quién es? –Mío.]]"],["un amigo mío","«Ένας φίλος μου»: μπαίνει ΜΕΤΑ το ουσιαστικό."],["el mío, la mía","«Το δικό μου», όταν συγκρίνεις: [[Tu coche es nuevo, el mío es viejo.]]"]],"e":["Este libro es mi.","Este libro es mío.","Όταν δεν ακολουθεί ουσιαστικό θέλει mío."]},{"h":"Έμμεσο αντικείμενο: me, te, le…","p":["[[me, te, le, nos, os, les]] = σε μένα, σε σένα, σε αυτόν… Όταν συναντηθούν [[le/les]] με [[lo/la/los/las]], το [[le]] γίνεται [[se]]."],"ex":[["Mi madre me regaló una brújula.","Η μητέρα μου μού χάρισε μια πυξίδα."],["¿Le das el mapa a Juan? – Sí, se lo doy.","Δίνεις τον χάρτη στον Χουάν; – Ναι, του τον δίνω."]],"i":"Το έμμεσο αντικείμενο λέει ΣΕ ΠΟΙΟΝ δίνεις, λες ή αγοράζεις κάτι. Στα ελληνικά: «μου», «σου», «του».","w":[["me, te, le, nos, os, les","Μπαίνουν ΠΡΙΝ από το ρήμα: [[Le doy el libro.]] = Του δίνω το βιβλίο."],["le → se","Όταν έχεις ΜΑΖΙ «του» και «το», το [[le]] γίνεται [[se]]: [[Se lo doy.]] = Του το δίνω. Ποτέ «le lo»."],["Η σειρά","Πρώτα ΣΕ ΠΟΙΟΝ, μετά ΤΙ: [[Me lo dio.]] = Μου το έδωσε."]],"e":["Le lo doy.","Se lo doy.","Δύο αντωνυμίες που αρχίζουν από l δεν πάνε μαζί: το le γίνεται se."]}],"13":[{"h":"Παρατατικός","p":["Για συνήθειες και περιγραφές στο παρελθόν: «έκανα, συνήθιζα να κάνω»."],"t":[["","hablar","comer","vivir"],["yo","hablaba","comía","vivía"],["tú","hablabas","comías","vivías"],["él / ella","hablaba","comía","vivía"],["nosotros","hablábamos","comíamos","vivíamos"],["vosotros","hablabais","comíais","vivíais"],["ellos","hablaban","comían","vivían"]],"i":"Ο παρατατικός λέει τι ΕΚΑΝΕΣ ΣΥΝΗΘΩΣ παλιά ή πώς ΗΤΑΝ τα πράγματα. Στα ελληνικά: «έπαιζα», «έμενα», «ήταν».","w":[["Συνήθειες","[[De niño jugaba en la calle.]] = Μικρός έπαιζα στον δρόμο."],["Περιγραφές","[[La casa era grande y tenía jardín.]]"],["Αόριστος αντί γι' αυτό","Όταν κάτι έγινε ΜΙΑ φορά και τελείωσε: [[Ayer jugué al fútbol.]]"]],"s":["Κόψε την κατάληξη.","Για [[-ar]] βάλε [[-aba]]: [[hablaba]]. Για [[-er]] και [[-ir]] βάλε [[-ía]]: [[comía]], [[vivía]].","Το «εγώ» και το «αυτός» είναι ίδια: [[yo hablaba]], [[él hablaba]]."],"e":["De niño jugué en la calle todos los días.","De niño jugaba en la calle todos los días.","Κάτι που γινόταν κάθε μέρα είναι συνήθεια: παρατατικός."]},{"h":"Τα τρία ανώμαλα","t":[["","ser","ir","ver"],["yo","era","iba","veía"],["tú","eras","ibas","veías"],["él / ella","era","iba","veía"],["nosotros","éramos","íbamos","veíamos"],["vosotros","erais","ibais","veíais"],["ellos","eran","iban","veían"]],"tip":"Το [[hay]] στον παρατατικό γίνεται [[había]]: [[Antes no había internet.]]","i":"Καλά νέα: στον παρατατικό μόνο τρία ρήματα είναι ανώμαλα.","w":[["ser → era","«Ήμουν»: [[Cuando era niño…]]"],["ir → iba","«Πήγαινα»: [[Iba al colegio a pie.]]"],["ver → veía","«Έβλεπα»: [[Veía la tele por la noche.]]"]],"e":["Cuando fui niño, vivía en un pueblo.","Cuando era niño, vivía en un pueblo.","Η ηλικία στο παρελθόν είναι περιγραφή: era."]},{"h":"Πριν και τώρα","p":["Λέξεις που ζητούν παρατατικό: [[antes, de niño/a, de joven, cuando era pequeño/a, en aquella época, entonces]]."],"ex":[["De niño jugaba en la calle.","Όταν ήμουν παιδί, έπαιζα στον δρόμο."],["Antes vivíamos en un pueblo, ahora vivimos en la ciudad.","Πριν ζούσαμε σε χωριό, τώρα ζούμε στην πόλη."]],"i":"Για να συγκρίνεις το τότε με το τώρα: παρατατικός για το «πριν», ενεστώτας για το «τώρα».","w":[["antes + παρατατικός","[[Antes vivía en Madrid.]]"],["ahora + ενεστώτας","[[Ahora vivo en Tesalónica.]]"],["ya no","«Δεν … πια»: [[Ya no fumo.]]"],["todavía","«Ακόμα»: [[Todavía vivo con mis padres.]]"]]},{"h":"Ποσότητες στα ψώνια","t":[["Ισπανικά","Ελληνικά"],["un kilo de","ένα κιλό"],["medio kilo de","μισό κιλό"],["un cuarto de kilo de","ένα τέταρτο του κιλού"],["un litro de","ένα λίτρο"],["una docena de","μια ντουζίνα"],["una barra de pan","μια φρατζόλα ψωμί"]],"ex":[["Quiero medio kilo de tomates.","Θέλω μισό κιλό ντομάτες."]],"i":"Στα ψώνια η ποσότητα συνδέεται πάντα με [[de]] και το προϊόν μπαίνει ΧΩΡΙΣ άρθρο.","w":[["ποσότητα + de + προϊόν","[[un kilo de tomates]], [[una botella de agua]], [[un paquete de arroz]]."],["¿Cuánto cuesta? / ¿Cuánto es?","Πόσο κάνει (ένα πράγμα); / Πόσο κάνουν όλα;"]],"e":["un kilo tomates","un kilo de tomates","Ανάμεσα θέλει πάντα de."]}],"14":[{"h":"Προστακτική (tú)","p":["Για οδηγίες και συμβουλές σε έναν φίλο. Είναι ίδια με το τρίτο ενικό του ενεστώτα."],"t":[["Ρήμα","Προστακτική"],["hablar","habla"],["beber","bebe"],["escribir","escribe"],["cerrar (e→ie)","cierra"],["dormir (o→ue)","duerme"]],"ex":[["Bebe mucha agua.","Πίνε πολύ νερό."],["Descansa un poco.","Ξεκουράσου λίγο."]],"i":"Η προστακτική είναι ο τύπος με τον οποίο λες σε κάποιον να κάνει κάτι: «μίλα», «φάε», «γράψε». Εδώ μαθαίνεις αυτήν για το «εσύ» (φίλος).","w":[["Οδηγίες","[[Gira a la derecha.]]"],["Συμβουλές","[[Bebe mucha agua.]]"],["Άρνηση","Θέλει άλλον τύπο: [[no hables]], [[no comas]]."]],"s":["Πάρε το «αυτός» του ενεστώτα: [[habla]], [[come]], [[escribe]].","Αυτό είναι! [[Habla más despacio.]] = Μίλα πιο αργά.","Αν το ρήμα αλλάζει ρίζα, αλλάζει κι εδώ: [[cerrar → cierra]]."],"e":["Hablas más despacio, por favor.","Habla más despacio, por favor.","Η προστακτική για το tú δεν έχει -s."]},{"h":"Τα 8 ανώμαλα","t":[["Ρήμα","Προστακτική","Ελληνικά"],["tener","ten","έχε"],["venir","ven","έλα"],["poner","pon","βάλε"],["salir","sal","βγες"],["hacer","haz","κάνε"],["decir","di","πες"],["ir","ve","πήγαινε"],["ser","sé","να είσαι"]],"i":"Οκτώ πολύ συχνά ρήματα έχουν σύντομη, ανώμαλη προστακτική. Είναι όλα μονοσύλλαβα.","e":["Hace la cama.","Haz la cama.","Η προστακτική του hacer είναι haz."],"ex":[["Ven aquí.","Έλα εδώ."],["Haz los deberes.","Κάνε τις ασκήσεις σου."],["Pon la mesa.","Στρώσε το τραπέζι."],["Dime la verdad.","Πες μου την αλήθεια."]]},{"h":"Με αντωνυμίες","p":["Η αντωνυμία κολλάει στο τέλος και συχνά χρειάζεται τόνος: [[levántate]] (σήκω), [[siéntate]] (κάθισε), [[dime]] (πες μου), [[hazlo]] (κάν' το)."],"i":"Στην προστακτική οι μικρές λέξεις ([[me, te, lo, la]]) δεν μπαίνουν μπροστά αλλά ΚΟΛΛΑΝΕ στο τέλος του ρήματος, σε μία λέξη.","s":["Φτιάξε την προστακτική: [[levanta]].","Κόλλησε την αντωνυμία στο τέλος: [[levanta + te]].","Βάλε τόνο εκεί που τονιζόταν πριν: [[levántate]]."],"e":["Te levanta.","Levántate.","Στην προστακτική η αντωνυμία πάει στο τέλος."]},{"h":"Estar + κατάσταση, quedar","p":["[[estar]] + [[cansado, nervioso, contento, enfermo, mareado]]: πώς νιώθω τώρα. Το επίθετο συμφωνεί: [[Ella está cansada.]]","[[quedar]] = κανονίζω να βρεθώ με κάποιον."],"ex":[["¿Quedamos a las seis?","Βρισκόμαστε στις έξι;"],["¿Dónde quedamos?","Πού θα βρεθούμε;"]],"i":"Το [[estar]] με επίθετο λέει πώς νιώθεις ΤΩΡΑ, κάτι προσωρινό. Το [[ser]] με επίθετο λέει πώς είσαι ΓΕΝΙΚΑ.","w":[["estar + επίθετο","Κατάσταση της στιγμής: [[Estoy cansado.]] · [[Está nerviosa.]]"],["ser + επίθετο","Χαρακτήρας: [[Es nervioso.]] = Είναι νευρικός άνθρωπος."],["quedar con + πρόσωπο","Κανονίζω να συναντηθώ: [[He quedado con Ana.]]"],["quedar a + ώρα / en + μέρος","[[Quedamos a las ocho en la plaza.]]"]],"e":["Soy cansado.","Estoy cansado.","Η κούραση είναι προσωρινή κατάσταση: estar."]}],"21":[{"h":"Πώς διαβάζονται τα ισπανικά","p":["Τα καλά νέα: τα ισπανικά διαβάζονται σχεδόν όπως γράφονται, και οι ήχοι τους υπάρχουν όλοι στα ελληνικά. Τα πέντε φωνήεντα [[a, e, i, o, u]] διαβάζονται πάντα α, ε, ι, ο, ου.","Λίγα γράμματα θέλουν προσοχή:"],"t":[["Γράμμα","Ήχος","Παράδειγμα"],["h","δεν προφέρεται","hola = όλα"],["j","χ","jamón = χαμόν"],["ge, gi","χε, χι","gente = χέντε"],["ll","γι","llave = γιάβε"],["ñ","νι","niño = νίνιο"],["z · ce, ci","θ","zapato = θαπάτο · cinco = θίνκο"],["ca, co, cu","κ","casa = κάσα"],["que, qui","κε, κι","queso = κέσο"],["gue, gui","γκε, γκι","guitarra = γκιτάρρα"],["ch","τσ","chico = τσίκο"],["v","μπ (όπως το b)","vino = μπίνο"]],"tip":"Πάτα οποιαδήποτε ισπανική λέξη στην εφαρμογή για να την ακούσεις. Κάτω από κάθε λέξη θα βλέπεις και την προφορά με ελληνικά γράμματα."},{"h":"Πού τονίζουμε","p":["Αν η λέξη έχει γραμμένο τόνο, τονίζουμε εκεί: [[café]], [[adiós]], [[perdón]].","Χωρίς γραμμένο τόνο: αν τελειώνει σε φωνήεν, [[n]] ή [[s]], τονίζουμε την προτελευταία συλλαβή ([[HOla]], [[GRAcias]]). Αλλιώς την τελευταία ([[hoTEL]], [[seÑOR]])."],"ex":[["Buenos días.","Καλημέρα."],["Muchas gracias.","Ευχαριστώ πολύ."],["Hasta luego.","Τα λέμε."]]},{"h":"Τα σημάδια ¿ και ¡","p":["Στα ισπανικά η ερώτηση ανοίγει με [[¿]] και κλείνει με [[?]]. Το ίδιο και το θαυμαστικό: [[¡Hola!]]","Το ερωτηματικό τους είναι το [[?]], όχι το δικό μας ( ; )."],"ex":[["¿Qué tal?","Τι κάνεις;"],["¡Muy bien!","Πολύ καλά!"]]}],"22":[{"h":"Εγώ, εσύ, αυτός, αυτή","p":["Το ρήμα [[ser]] σημαίνει «είμαι». Το χρησιμοποιούμε για το ποιος είμαι και από πού είμαι."],"t":[["Πρόσωπο","ser","Ελληνικά"],["yo","soy","είμαι"],["tú","eres","είσαι"],["él / ella","es","είναι"]],"ex":[["Soy María.","Είμαι η Μαρία."],["Eres mi amigo.","Είσαι ο φίλος μου."],["Ella es de España.","Αυτή είναι από την Ισπανία."]],"tip":"Όπως στα ελληνικά, το [[yo]] συνήθως παραλείπεται: [[Soy María]] = Είμαι η Μαρία.","w":[["Soy + όνομα","[[Soy María.]]"],["Soy de + τόπος","[[Soy de Grecia.]] = Είμαι από την Ελλάδα."],["Soy + εθνικότητα","[[Soy griega.]]"]],"e":["Yo es María.","Yo soy María.","Το «εγώ» θέλει soy. Το es είναι για «αυτός / αυτή»."]},{"h":"Με λένε…","p":["[[Me llamo]] = με λένε. [[¿Cómo te llamas?]] = πώς σε λένε;","Για την καταγωγή: [[¿De dónde eres?]] – [[Soy de Grecia.]]"],"ex":[["Me llamo Elena.","Με λένε Ελένη."],["¿Cómo te llamas?","Πώς σε λένε;"],["Soy de Grecia.","Είμαι από την Ελλάδα."]]},{"h":"Αρσενικό και θηλυκό","p":["Οι περισσότερες λέξεις για άντρα τελειώνουν σε [[-o]] και για γυναίκα σε [[-a]]: [[amigo]] → [[amiga]], [[griego]] → [[griega]].","Αν το αρσενικό τελειώνει σε σύμφωνο, προσθέτουμε [[-a]]: [[español]] → [[española]], [[señor]] → [[señora]]."]}],"23":[{"h":"Έχω: tener","p":["[[Tener]] = έχω. Προσοχή: και την ηλικία τη λέμε με το [[tener]], όχι με το ser."],"t":[["Πρόσωπο","tener"],["yo","tengo"],["tú","tienes"],["él / ella","tiene"]],"ex":[["Tengo dos hermanos.","Έχω δύο αδέλφια."],["¿Cuántos años tienes?","Πόσο χρονών είσαι;"],["Tengo veinte años.","Είμαι είκοσι χρονών."]],"e":["Soy veinte años.","Tengo veinte años.","Η ηλικία λέγεται με το tener: «έχω είκοσι χρόνια»."]},{"h":"Μου και σου: mi, tu","p":["[[mi]] = μου, [[tu]] = σου. Μπαίνουν πριν από το ουσιαστικό και χωρίς άρθρο: [[mi madre]] = η μητέρα μου.","Για πολλά: [[mis]], [[tus]]: [[mis hijos]] = τα παιδιά μου."],"tip":"[[tu]] χωρίς τόνο = σου. [[tú]] με τόνο = εσύ."},{"h":"Πληθυντικός","p":["Αν η λέξη τελειώνει σε φωνήεν, βάζουμε [[-s]]: [[hermano]] → [[hermanos]]. Αν τελειώνει σε σύμφωνο, [[-es]]: [[mujer]] → [[mujeres]].","Το αρσενικό στον πληθυντικό καλύπτει και μικτές ομάδες: [[los hijos]] = οι γιοι ή τα παιδιά, [[los padres]] = οι γονείς."]}],"24":[{"h":"Τα άρθρα: el, la, un, una","p":["Στα ισπανικά υπάρχουν μόνο δύο γένη, αρσενικό και θηλυκό. Ουδέτερο δεν υπάρχει."],"t":[["","Αρσενικό","Θηλυκό"],["ο / η / το","el libro","la casa"],["ένας / μία / ένα","un libro","una casa"],["οι / τα","los libros","las casas"]],"tip":"Συνήθως: λέξη σε [[-o]] → [[el]], λέξη σε [[-a]] → [[la]]. Μάθαινε κάθε λέξη μαζί με το άρθρο της.","w":[["el / la","«Ο, η, το». Για κάτι συγκεκριμένο: [[la casa]] = το σπίτι (αυτό που ξέρουμε)."],["un / una","«Ένας, μία, ένα». Για κάτι οποιοδήποτε: [[una casa]] = ένα σπίτι."],["los / las","Για πολλά: [[los libros]], [[las casas]]."]],"e":["el casa","la casa","Η λέξη τελειώνει σε -a: είναι θηλυκή."]},{"h":"Υπάρχει: hay","p":["[[Hay]] = υπάρχει ή υπάρχουν. Δεν αλλάζει ποτέ. Μετά βάζουμε [[un / una]] ή αριθμό, ποτέ el / la."],"ex":[["Hay una mesa en la cocina.","Υπάρχει ένα τραπέζι στην κουζίνα."],["Hay dos camas.","Υπάρχουν δύο κρεβάτια."]],"e":["Hay la mesa en la cocina.","Hay una mesa en la cocina.","Μετά το hay μπαίνει un / una, όχι el / la."]},{"h":"Το επίθετο συμφωνεί","p":["Το επίθετο μπαίνει συνήθως μετά το ουσιαστικό και παίρνει το γένος του: [[el baño pequeño]], [[la cocina pequeña]].","Όσα τελειώνουν σε [[-e]] δεν αλλάζουν: [[el libro grande]], [[la casa grande]]."]}],"25":[{"h":"Θέλω: querer","p":["Στο [[querer]] το e γίνεται ie όταν τονίζεται."],"t":[["Πρόσωπο","querer"] const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rnd = n => Math.floor(Math.random()*n);
const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){ const j=rnd(i+1); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const cap = s => s ? s[0].toUpperCase()+s.slice(1) : s;
const clean = s => String(s).toLowerCase().replace(/[¿?¡!.,;:"'«»()…]/g,' ').replace(/\s+/g,' ').trim();
const noAcc = s => s.normalize('NFD').replace(/[̀-ͯ]/g,'');
function check(input, answers){
  const a = clean(input); if (!a) return 'wrong';
  for (const x of answers) if (clean(x) === a) return 'ok';
  for (const x of answers) if (noAcc(clean(x)) === noAcc(a)) return 'accent';
  return 'wrong';
}

/* ---------- vocabulary answer variants: "el/la abuelo/a" → abuelo, abuela, el abuelo ... ---------- */
function variants(es){
  if (/^el\/la /.test(es)){
    const r = es.slice(6), m = r.replace(/o\/a\b/g,'o').replace(/\/-a\b/g,''), f = r.replace(/o\/a\b/g,'a').replace(/\/-a\b/g,'a');
    return [...new Set([es, ...variants('el '+m), ...variants('la '+f)])];
  }
  const out = new Set([es]);
  const parts = es.split(/\s+/);
  let combos = [[]];
  for (const p of parts){
    let opts;
    if (p === 'el/la') opts = ['el','la',''];
    else if (/^[^/]+\/-a$/.test(p)) { const b=p.split('/')[0]; opts=[b, b+'a']; }
    else if (/^[^/]+o\/a$/.test(p)) { const b=p.slice(0,-2); opts=[b, b.slice(0,-1)+'a']; }
    else if (/^[^/]+\/[^/]+$/.test(p)) opts = p.split('/');
    else opts = [p];
    const n=[]; for (const c of combos) for (const o of opts) n.push(o ? c.concat(o) : c); combos = n;
  }
  for (const c of combos){ const s=c.join(' ').replace(/,$/,''); out.add(s); out.add(s.replace(/^(el|la|los|las|un|una) /,'')); }
  es.split(/,\s*/).forEach(x => { out.add(x); out.add(x.replace(/^(el|la|los|las) /,'')); });
  return [...out].filter(Boolean);
}

/* ---------- approximate Greek-letter pronunciation (Spain) ---------- */
const VOW = {a:'α',e:'ε',i:'ι',o:'ο',u:'ου','á':'α','é':'ε','í':'ι','ó':'ο','ú':'ου','ü':'ου'};
const ACC = {'α':'ά','ε':'έ','ι':'ί','ο':'ό','ου':'ού'};
const PRON_EX = {'méxico':'μέχικο','mexicano':'μεχικάνο','mexicana':'μεχικάνα','mexicanos':'μεχικάνος'};
function pronWord(w){
  w = w.toLowerCase(); if (PRON_EX[w]) return PRON_EX[w];
  const T = []; // tokens {g, v:bool, strong, written}
  const isV = c => 'aeiouáéíóúü'.includes(c);
  for (let i=0;i<w.length;i++){
    const c=w[i], n=w[i+1]||'', p=w[i-1]||'';
    if (isV(c)) { T.push({g:VOW[c], v:true, strong:'aeoáéó'.includes(c), written:'áéíóú'.includes(c)}); continue; }
    if (c==='y'){ if (i===w.length-1 || !isV(n)) T.push({g:'ι',v:true,strong:false}); else T.push({g:'γι'}); continue; }
    if (c==='c'){ if (n==='h'){T.push({g:'τσ'});i++;continue;} T.push({g:'eéiíé'.includes(n)?'θ':'κ'}); continue; }
    if (c==='q'){ T.push({g:'κ'}); if (n==='u') i++; continue; }
    if (c==='g'){ if (n==='u' && 'eéií'.includes(w[i+2]||'')){ T.push({g:'γκ'}); i++; continue; }
                 if ('eéií'.includes(n)) { T.push({g:'χ'}); continue; }
                 T.push({g:(i===0||p==='n')?'γκ':'γ'}); continue; }
    if (c==='l' && n==='l'){ T.push({g:'γι'}); i++; continue; }
    if (c==='r'){ if (n==='r'){T.push({g:'ρρ'});i++;continue;} T.push({g:(i===0||'nls'.includes(p))?'ρρ':'ρ'}); continue; }
    if (c==='d'){ T.push({g:(i===0||'nl'.includes(p))?'ντ':'δ'}); continue; }
    const M = {b:'μπ',v:'μπ',f:'φ',h:'',j:'χ',k:'κ',l:'λ',m:'μ',n:'ν','ñ':'νι',p:'π',s:'σ',t:'τ',x:'ξ',z:'θ',w:'ου'};
    T.push({g: M[c] ?? ''});
  }
  // nuclei
  const nuc = []; let k=0;
  while (k<T.length){
    if (!T[k].v){k++;continue;}
    let grp=[k]; k++;
    while (k<T.length && T[k].v){
      const prev=T[grp[grp.length-1]], cur=T[k];
      if ((prev.strong && cur.strong) || prev.written&&!prev.strong&&cur.strong || cur.written&&!cur.strong) break;
      grp.push(k); k++;
    }
    nuc.push(grp);
  }
  if (!nuc.length) return T.map(t=>t.g).join('');
  let si = nuc.findIndex(g => g.some(i=>T[i].written));
  if (si<0){ const last=w[w.length-1]; si = (nuc.length===1)?0:('aeiouns'.includes(last)? nuc.length-2 : nuc.length-1); }
  const g = nuc[si]; let vi = g.find(i=>T[i].written);
  if (vi===undefined){ const st=g.filter(i=>T[i].strong); vi = st.length? st[0] : g[g.length-1]; }
  const mono = nuc.length===1;
  // write diaeresis for a/e/o + ι that would read as Greek digraph
  for (let i=1;i<T.length;i++) if (T[i].g==='ι' && T[i].v && T[i-1].v && ['α','ε','ο'].includes(T[i-1].g) && i!==vi && i-1!==vi) T[i].g='ϊ';
  if (!mono || g.length>1){ const pv=T[vi-1]; T[vi].g = (T[vi].g==='ι' && pv && pv.v && ['α','ε','ο'].includes(pv.g)) ? 'ΐ' : (ACC[T[vi].g] || T[vi].g); }
  let s = T.map(t=>t.g).join('');
  return s.replace(/σ$/,'ς');
}
const pron = s => String(s).toLowerCase().replace(/^el\/la /,'el ').replace(/o\/a\b/g,'o').replace(/\/-a\b/g,'').replace(/[¿?¡!.,;:()…]/g,'').split(/[\s/]+/).filter(Boolean).map(w => w==='y'?'ι':pronWord(w)).join(' ');

function qNum(u, n, fmt){

  const b = {type:'n', unit:+u, id:`n|${u}|${n}`, answers:[w], show:w, say:w};

function qTime(h, m, typed){
  const a = timeAnswers(h, m), wrong = [];
  for (const [hh,mm] of [[h%12+1,m],[h,(m+30)%60],[h===1?12:h-1,m]]) wrong.push(timeAnswers(hh,mm)[0]);
  if (m > 30) wrong.push(base(h)+' menos '+(60-m===15?'cuarto':num(60-m)));
  if (m > 0 && m < 30) wrong.push(base(h%12+1)+' menos '+(m===15?'cuarto':num(m)));
  return {type:'t', unit:SET.course === 'zero' ? 27 : 2, id:`t|${h}|${m}`, ui:typed?'type':'mc', label:'¿Qué hora es?', prompt:hm(h,m), big:true, answers:a, show:cap(a[0])+'.', say:cap(a[0]), options:shuffle(uniq([cap(a[0]), ...shuffle(wrong).map(cap)]).slice(0,4))};

function qMatch(u, idxs){

  return {type:'m', unit:+u, id:`m|${u}|${idxs.join(',')}`, ui:'match', label:'Ταίριαξε τα ζευγάρια', pairs, left:shuffle(range(pairs.length)), right:shuffle(range(pairs.length)), answers:[], show:''};

const genderable = (u,i) => /^(el|la) \S+$/.test(V[u][i][0]);
const audioOn = () => canSpeak && SET.audio;
function build(id, mode){

  const e = ST.srs[baseId(id)]; let bx = e ? e.b : -1; if (slow() && bx >= 1) bx--;   // step-by-step pace: writing comes one stage later   // -1 = never seen, 0 = missed, 1+ = known better and better

  switch (p[0]){
    case 'v': { let f;
      if (mode==='mc') f = bx < 1 ? (r<.5?'eg':'ge-mc') : (r<.5?'ctx-mc':'ge-mc');
      else if (mode==='type') f = (audioOn() && r<.15) ? 'listen' : (bx >= 1 && r<.5) ? 'ctx-type' : 'ge-type';
      else f = bx < 0 ? (r<.6?'eg':'ge-mc') : bx === 0 ? (r<.5?'ge-mc':'ctx-mc') : bx === 1 ? (r<.5?'ctx-mc':'ge-type') : bx === 2 ? (r<.5?'ge-type':'ctx-type') : (r<.4?'ctx-type': (r<.8||!audioOn())?'ge-type':'listen');
      return qVocab(p[1], +p[2], f); }
    case 'g': return qGender(p[1], +p[2]);
    case 'c': return qVerb(p[1], +p[2], +p[3], typed);
    case 'ct': return qTable(p[1], +p[2]);
    case 'qa': return qQA(+p[1], +p[2], +p[3], +p[4], typed);
    case 'd': return qDlg(p[1], p[2]);
    case 'f': return qFill(p[1], +p[2], mode==='type'?'type': mode==='mc'?(r<.6?'mc':'bank') : bx < 1 ? 'mc' : bx === 1 ? 'bank' : 'type');
    case 'p': return qPhrase(p[1], +p[2], mode==='type'?'type': mode==='mc'?'bank' : bx < 1 ? 'bank' : (r<.85||!audioOn()) ? 'type' : 'listen');
    case 'n': return qNum(p[1], +p[2], (mode==='mix' && audioOn() && r>.8) ? 'listen' : typed?'type':'mc');
    case 't': return qTime(+p[1], +p[2], typed);

const safe = f => { try{ return f(); }catch(e){ return null; } };

const LCACHE = {};
function lessonsOf(u){

  const NCFG = {22:[{k:'N', lo:0, hi:10, name:'Αριθμοί 0–10', sub:'cero, uno, dos, tres…'}], 23:[{k:'N', lo:8, hi:20, name:'Αριθμοί 11–20', sub:'once, doce, trece…'}], 27:[{k:'T', name:'Η ώρα', sub:'¿Qué hora es?'}]};
  const q = {
    V: chunk(range((V[u]||[]).length), sl ? 4 : 6, sl ? 3 : 0).map((ix,k) => ({k:'V', ix, name:'Λέξεις '+(k+1), sub:ix.slice(0,3).map(i=>V[u][i][0]).join(' · ')})),
    F: chunk(range((F[u]||[]).length), sl ? 4 : 6, sl ? 3 : 0).map((ix,k) => ({k:'F', ix, name:'Γραμματική '+(k+1), sub:[...new Set(ix.map(i=>F[u][i].x))].slice(0,2).join(' · ')})),
    C: chunk(range((VB[u]||[]).length), (VB[u]||[])[0] && VB[u][0].t==='impv' ? 5 : sl ? 2 : 3, sl ? 2 : 0).map((ix,k) => ({k:'C', ix, name:'Ρήματα '+(k+1), sub:ix.map(i=>VB[u][i].v).join(' · ')})),
    P: chunk(range((P[u]||[]).length), 5).map((ix,k,a) => ({k:'P', ix, name:'Προτάσεις'+(a.length>1?' '+(k+1):''), sub:'Σχημάτισε και γράψε ολόκληρες προτάσεις'})),
    N: NCFG[u] ? NCFG[u] : u===2 ? [{k:'N', lo:0, hi:30, name:'Αριθμοί 0–30', sub:'cero, uno, dos…'}, {k:'T', name:'Η ώρα', sub:'¿Qué hora es?'}] : u===3 ? [{k:'N', lo:31, hi:100, name:'Αριθμοί 31–100', sub:'treinta y uno… cien'}] : u===6 ? [{k:'N', lo:101, hi:1000, name:'Αριθμοί 100–1000', sub:'ciento uno… mil'}] : []
  };
  const order = ['V','F','V','C','V','N','V','P'], out = [], cnt = {};

  if (PQ[u]) out.unshift({k:'R', id:`${u}.R1`, u, name:'Πώς διαβάζεται;', sub:'Η προφορά των ισπανικών γραμμάτων'});

}
function lessonQs(L){
  const u = L.u, m = slow() && SET.mode === 'mix' ? 'mc' : SET.mode, alt = i => m==='type' ? true : m==='mc' ? false : i%2===1, qs = [];
  if (L.k === 'V'){
    shuffle(L.ix).forEach(i => qs.push(qVocab(u, i, 'eg')));
    qs.push(qMatch(u, shuffle(L.ix).slice(0,5)));
    shuffle(L.ix).forEach((i,k) => qs.push(qVocab(u, i, alt(k) ? 'ge-type' : 'ge-mc')));
    if (CX[u]) shuffle(L.ix.filter(i => CX[u][i])).slice(0,3).forEach((i,k) => qs.push(qVocab(u, i, m==='type' || (m==='mix' && k===2) ? 'ctx-type' : 'ctx-mc')));
    if (audioOn()) shuffle(L.ix).slice(0,2).forEach(i => qs.push(qVocab(u, i, m === 'mc' ? 'listen-mc' : 'listen')));
    shuffle(L.ix.filter(i => genderable(u,i))).slice(0,2).forEach(i => qs.push(qGender(u, i)));
  } else if (L.k === 'C'){
    L.ix.forEach(i => { const impv = VB[u][i].t==='impv'; (impv ? [0,0] : shuffle(range(6)).slice(0, m==='mc' ? 4 : 3)).forEach((p,k) => qs.push(qVerb(u, i, p, alt(k)))); });
    const out = shuffle(qs);
    if (m !== 'mc') L.ix.filter(i => VB[u][i].t !== 'impv').forEach(i => out.push(qTable(u, i)));
    if (qaOk(u)) range(3).forEach(k => out.push(safe(() => build(qaId(u), m==='mix' ? (k%2 ? 'type' : 'mc') : m))));
    return out.filter(Boolean);
  } else if (L.k === 'F'){
    L.ix.forEach((i,k) => qs.push(qFill(u, i, alt(k) ? 'type' : 'mc')));
    const b = shuffle(L.ix).filter(i => bankable(fillSentence(F[u][i]))).slice(0,3).map(i => qFill(u, i, 'bank'));
    return shuffle(qs).concat(b, slow() ? shuffle(L.ix).map(i => qFill(u, i, 'mc')) : []);
  } else if (L.k === 'P'){
    L.ix.forEach(i => qs.push(qPhrase(u, i, 'bank')));
    L.ix.forEach(i => qs.push(qPhrase(u, i, m==='mc' ? 'mc' : 'type')));
    if (audioOn() && m !== 'mc') shuffle(L.ix).slice(0,2).forEach(i => qs.push(qPhrase(u, i, 'listen')));
  } else if (L.k === 'N'){
    const seen = new Set(); while (seen.size < 10) seen.add(L.lo + rnd(L.hi - L.lo + 1));
    [...seen].forEach((n,k) => qs.push(qNum(u, n, (audioOn() && k%4===3) ? 'listen' : alt(k) ? 'type' : 'mc')));
  } else if (L.k === 'T'){
    const seen = new Set(['1|0','3|15','6|30','8|45']); while (seen.size < 10) seen.add((1+rnd(12))+'|'+(5*rnd(12)));
    [...seen].forEach((s,k) => { const [h,mm] = s.split('|').map(Number); qs.push(qTime(h, mm, alt(k))); });
  } else if (L.k === 'R'){
    shuffle(range(PQ[u].length)).slice(0,10).forEach(k => qs.push(qPron(u, k)));
  } else if (L.k === 'D'){
    const d = DG[u], ln = shuffle(range(d.l.length)), words = k => d.l[k][1].split(/\s+/).length;
    range(3).forEach(k => qs.push(qDlg(u, 'q'+k)));
    ln.filter(k => words(k) >= 3).slice(0,3).forEach(k => qs.push(qDlg(u, 'm'+k)));
    ln.filter(k => bankable(d.l[k][1])).slice(0,2).forEach(k => qs.push(qDlg(u, 'b'+k)));
    if (audioOn() && m !== 'mc') ln.filter(k => words(k) >= 2 && words(k) <= 5).slice(0,1).forEach(k => qs.push(qDlg(u, 'l'+k)));
  } else {
    const pools = poolFor([u], ['v','c','f','p','n','g']);
    return pickMixed(pools, 16).map(id => safe(() => build(id, m))).filter(Boolean);
  }
  return qs;
}
function poolFor(units, types){
  const pools = {};
  const add = (k, id) => (pools[k] = pools[k] || []).push(id);
  for (const u of units){
    if (types.includes('v')) (V[u]||[]).forEach((_,i) => add('v', `v|${u}|${i}`));
    if (types.includes('g')) (V[u]||[]).forEach((_,i) => { if (genderable(u,i)) add('g', `g|${u}|${i}`); });
    if (types.includes('c')){ (VB[u]||[]).forEach((vb,i) => add('c', `c|${u}|${i}|${vb.t==='impv'?0:rnd(6)}`));
      if (qaOk(u)) for (let k=0;k<3;k++){ const id = qaId(u); if (id) add('c', id); }
      if (SET.mode !== 'mc'){ const tv = range((VB[u]||[]).length).filter(i => VB[u][i].t !== 'impv'); shuffle(tv).slice(0,2).forEach(i => add('c', `ct|${u}|${i}`)); } }
    if (types.includes('d') && DG[u]){ range(3).forEach(k => add('d', `d|${u}|q${k}`)); DG[u].l.forEach((x,k) => { if (x[1].split(/\s+/).length >= 3) add('d', `d|${u}|m${k}`); }); }
    if (types.includes('f')) (F[u]||[]).forEach((_,i) => add('f', `f|${u}|${i}`));
    if (types.includes('p')) (P[u]||[]).forEach((_,i) => add('p', `p|${u}|${i}`));
    if (types.includes('n')){
      if (u===2){ for (let k=0;k<8;k++) add('n', `n|2|${rnd(31)}`); for (let k=0;k<12;k++) add('n', `t|${1+rnd(12)}|${5*rnd(12)}`); }
      if (u===3) for (let k=0;k<12;k++) add('n', `n|3|${31+rnd(70)}`);
      if (u===6) for (let k=0;k<12;k++) add('n', `n|6|${101+rnd(900)}`);
      if (u===22) for (let k=0;k<8;k++) add('n', `n|22|${rnd(11)}`);
      if (u===23) for (let k=0;k<8;k++) add('n', `n|23|${rnd(21)}`);
      if (u===27) for (let k=0;k<8;k++) add('n', `t|${1+rnd(12)}|${15*rnd(4)}`);
    }
  }
  return pools;
}
function pickMixed(pools, n){
  const keys = Object.keys(pools).filter(k => pools[k].length), ids = []; let r = 0;
  for (const k of keys) pools[k] = shuffle(pools[k]);
  const w = {v:3, f:3, c:2, p:2, n:1, g:1}, order = keys.flatMap(k => Array(w[k]||1).fill(k));
  while (ids.length < n && keys.some(k => pools[k].length)){ const k = order[r++ % order.length]; if (pools[k].length) ids.push(pools[k].pop()); }
  return shuffle(ids);
}

/* ================= session engine ================= */
let TAB = 'path', VIEW = 'tab', S = null, ANS = null, FC = null, UNIT = 1, GUIDE = 1, BANK = [], MSEL = null, MFLASH = null, LASTINP = null, DTR = false, BKMSG = '';
const app = $('#app');
function startSession(qs, meta){
  qs = qs.filter(Boolean); if (!qs.length) return;
  S = Object.assign({qs, i:0, res:[], xp0:ST.xp, retried:new Set()}, meta); MISSED = new Set(); ANS = null; BANK = []; MSEL = null;
  VIEW = meta.intro ? 'intro' : 'quiz'; render(); if (VIEW==='quiz') autoSay();
}
function autoSay(){ const q = S && S.qs[S.i]; if (q && q.audio && !ANS) setTimeout(() => speak(q.audio), 250); }
function finish(ok, input, note){
  const q = S.qs[S.i], first = !q.retry;
  ANS = {input, res: ok === true ? 'ok' : ok === 'accent' ? 'accent' : 'wrong', note};
  const good = ANS.res !== 'wrong';
  ANS.diag = diag(q, input, ANS.res);
  if (first) S.res.push({q, ok:good});
  record(q, good, first, ANS.res);
  if (!good && (S.kind === 'lesson' || S.kind === 'daily') && !S.retried.has(q.id) && q.ui !== 'match'){ S.retried.add(q.id);
    S.qs.push(Object.assign({}, q, {retry:true, options:q.options && shuffle(q.options), tiles:q.tiles && shuffle(q.tiles), rows:q.rows && q.rows.map(r => ({id:r.id, f:r.f, ok:false, inp:''}))})); }
  render();
  const fb = $('.fb'); if (fb) fb.scrollIntoView({block:'nearest', behavior:'smooth'});
}
function answer(input){
  if (ANS) return; const q = S.qs[S.i];
  if (q.ui === 'type'){ const r = q.numeric ? (input.trim() === q.answers[0] ? 'ok' : 'wrong') : check(input, q.answers); finish(r === 'ok' ? true : r, input); }
  else if (q.ui === 'bank'){ const s = BANK.map(i => q.tiles[i]).join(' '); finish(q.answers.some(a => clean(a) === clean(s)), s); }
  else finish(q.answers.some(a => clean(a) === clean(input)), input);
}
function answerTable(vals){
  if (ANS) return; const q = S.qs[S.i]; let acc = false;
  q.rows.forEach((r, p) => { const res = check(vals[p] || '', [r.f, r.f.replace(REFL, '')]); r.inp = (vals[p] || '').trim(); r.ok = res !== 'wrong'; r.acc = res === 'accent'; if (r.acc) acc = true; });
  const n = q.rows.filter(r => r.ok).length;
  finish(n === 6 ? (acc ? 'accent' : true) : n >= 5, '', n === 6 ? '' : `${n} από τα 6 σωστά.`);
}
function next(){
  if (S.i + 1 < S.qs.length){ S.i++; ANS = null; BANK = []; MSEL = null; LASTINP = null; render(); autoSay(); return; }
  endSession();
}
function endSession(){
  const n = S.res.length, ok = S.res.filter(r => r.ok).length, acc = n ? ok/n : 0;
  S.stars = acc >= .9 ? 3 : acc >= .7 ? 2 : 1;
  if (S.kind === 'daily' && ST.daily !== TODAY()){ ST.daily = TODAY(); addXp(20); ST.up = Date.now(); saveLocal(); }
  if (S.kind === 'lesson'){ if (!ST.done[S.lid]) addXp(20); ST.done[S.lid] = Math.max(ST.done[S.lid]||0, S.stars); ST.up = Date.now(); saveLocal(); }
  VIEW = 'res'; render(); syncPush();
}
function openLesson(L){
  const qs = lessonQs(L).filter(Boolean);
  if (L.k !== 'X' && L.k !== 'D'){   // a few older items that are due come back inside the new lesson
    const own = new Set(qs.flatMap(q => q.pairs ? q.pairs.map(p => p.id) : q.rows ? q.rows.map(r => r.id) : [baseId(q.id)]));
    const rv = shuffle(dueIds().filter(id => !own.has(id) && id[0] !== 'm')).slice(0,3).map(id => safe(() => build(id, SET.mode))).filter(Boolean);
    rv.forEach((q, k) => { q.rev = true; qs.splice(Math.floor(qs.length * (k+1) / 4), 0, q); });
  }
  DTR = false;
  startSession(qs, {kind:'lesson', lid:L.id, lesson:L, title:L.name, intro: L.k==='D' || L.k==='R' || ((L.k==='V' || L.k==='C' || L.k==='F') && !ST.done[L.id]) ? L : null});
}
function dailyQs(){
  const u = SET.cur, ids = shuffle(dueIds().filter(id => id[0] !== 'm')).slice(0,8);
  const fresh = (pre, n, len) => shuffle(range(len).map(i => `${pre}|${u}|${i}`).filter(id => !ST.srs[id])).slice(0,n);
  ids.push(...fresh('v', 4, (V[u]||[]).length), ...fresh('f', 2, (F[u]||[]).length));
  const w = weakSkills()[0]; if (w) skillIds(w.k, 3).forEach(id => { if (!ids.includes(id)) ids.push(id); });
  if (ids.length < 10) pickMixed(poolFor([u], ['v','c','f','p']), 12).forEach(id => { if (ids.length < 10 && !ids.includes(id)) ids.push(id); });
  return ids.map(id => safe(() => build(id, SET.mode))).filter(Boolean);

/* ================= diff for typed answers ================= */
function lcs(a, b){
  const n=a.length, m=b.length, T=Array.from({length:n+1}, ()=>new Uint16Array(m+1));
  for (let i=n-1;i>=0;i--) for (let j=m-1;j>=0;j--) T[i][j] = a[i]===b[j] ? T[i+1][j+1]+1 : Math.max(T[i+1][j], T[i][j+1]);
  const ka=new Array(n).fill(false), kb=new Array(m).fill(false); let i=0, j=0;
  while (i<n && j<m){ if (a[i]===b[j]){ ka[i]=kb[j]=true; i++; j++; } else if (T[i+1][j] >= T[i][j+1]) i++; else j++; }
  return {ka, kb, len:T[0][0]};
}
function diffHtml(user, answers){
  const u = user.trim(); if (!u) return null;
  let best = null;
  for (const a of answers.slice(0,8)){ const t = a.replace(/[¿?¡!.]/g,''); const r = lcs(u.toLowerCase(), t.toLowerCase()); const score = r.len*2 - u.length - t.length; if (!best || score > best.score) best = {t, r, score}; }
  const mark = (s, keep, cls) => { let h='', open=false; for (let k=0;k<s.length;k++){ const bad = !keep[k] && s[k] !== ' '; if (bad && !open){ h += `<mark class="${cls}">`; open=true; } if (!bad && open){ h += '</mark>'; open=false; } h += esc(s[k]); } return h + (open?'</mark>':''); };
  return {you: mark(u, best.r.ka, 'dx'), ok: mark(best.t, best.r.kb, 'dn'), target: best.t};
}
