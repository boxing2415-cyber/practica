<!doctype html>
<html lang="el"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Práctica de español</title>
<meta name="description" content="Εξάσκηση στα ισπανικά A1–A2: λέξεις, ρήματα, γραμματική, ακρόαση και επανάληψη.">
<meta name="theme-color" content="#F4F6FB" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1422" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Commissioner:wght@400;500;600;700&family=Literata:opsz,wght@7..72,500;7..72,700&display=swap">
<style>:root{color-scheme:light;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<style>
/* Layout: one phone-width column; tab bar pinned to the bottom, lesson route as a vertical line of stops */
:root{
  --bg:#F4F6FB; --surface:#FFFFFF; --ink:#15203A; --muted:#5A6580; --line:#DCE2EE;
  --accent:#1E5DBF; --accent-ink:#FFFFFF; --accent-soft:#E3ECFA; --sun:#D9911A; --sun-soft:#FCF1DA;
  --ok:#1B8656; --ok-soft:#E1F3EA; --bad:#C2413A; --bad-soft:#FBE6E4;
  --f-display:"Literata", Georgia, "Times New Roman", serif;
  --f-body:"Commissioner", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1422; --surface:#161F33; --ink:#E7ECF7; --muted:#9BA7C3; --line:#28324B;
  --accent:#6FA2FF; --accent-ink:#0B1222; --accent-soft:#1D2B4A; --sun:#F2BE57; --sun-soft:#33291A;
  --ok:#4CC38A; --ok-soft:#14301F; --bad:#F27A6F; --bad-soft:#3A1C1A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1422; --surface:#161F33; --ink:#E7ECF7; --muted:#9BA7C3; --line:#28324B;
  --accent:#6FA2FF; --accent-ink:#0B1222; --accent-soft:#1D2B4A; --sun:#F2BE57; --sun-soft:#33291A;
  --ok:#4CC38A; --ok-soft:#14301F; --bad:#F27A6F; --bad-soft:#3A1C1A; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,summary:focus-visible,#card:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
svg{width:1em;height:1em;display:block}
.es,.es2{font-weight:600;color:var(--accent)}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 170px}
.wrap.quiz{padding-block:0 120px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 10px;display:flex;align-items:center;gap:12px}
h1{font-family:var(--f-display);font-weight:700;font-size:1.6rem;line-height:1.1;margin:0;text-wrap:balance;min-width:0}
h1 small{display:block;font-family:var(--f-body);font-size:.8rem;font-weight:500;color:var(--muted);letter-spacing:.02em;margin-top:4px}
h2{font-size:.78rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600;margin:22px 0 10px}
.sub{color:var(--muted);font-size:.95rem}
.note{font-size:.82rem;color:var(--muted);margin:8px 0 0}
/* home */
.stats{display:grid;grid-template-columns:1fr 1fr 1.25fr;gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;display:flex;flex-direction:column;gap:1px;min-width:0}
.stat b{font-family:var(--f-display);font-size:1.4rem;font-variant-numeric:tabular-nums;line-height:1.15}
.stat span{font-size:.76rem;color:var(--muted);line-height:1.25}
.ic{display:inline-flex;font-size:1.05rem}.ic.sun{color:var(--sun)}.ic.acc{color:var(--accent)}
.stat.goal{flex-direction:row;align-items:center;gap:10px}
.ring{--p:0;width:52px;height:52px;flex:none;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--ok) calc(var(--p)*1%),var(--line) 0)}
.ring b{width:40px;height:40px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-family:var(--f-body);font-size:.72rem;font-weight:700}
.cont{display:flex;flex-direction:column;gap:2px;text-align:left;width:100%;margin-top:10px;border:0;border-radius:18px;padding:16px 18px;background:var(--accent);color:var(--accent-ink)}
.cont .k{font-size:.74rem;text-transform:uppercase;letter-spacing:.09em;font-weight:600;opacity:.85}
.cont .n{font-family:var(--f-display);font-size:1.35rem;font-weight:700;line-height:1.2}
.cont .s{font-size:.86rem;opacity:.9;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cont:disabled{background:var(--surface);color:var(--muted);border:1px dashed var(--line);cursor:default}
.units{display:flex;flex-direction:column;gap:6px}
.unit{display:block;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);padding:10px 12px;width:100%}
.unit .in{display:grid;grid-template-columns:38px minmax(0,1fr) auto;gap:10px;align-items:center}
.unit .num{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:1.05rem;background:var(--bg);border:1px solid var(--line)}
.unit .num.full{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.unit .t{min-width:0}
.unit .es{font-weight:600;font-size:.98rem;display:block;color:var(--ink)}
.unit .gr{font-size:.8rem;color:var(--muted);display:block}
.unit .bar{display:block;height:4px;border-radius:4px;background:var(--line);margin-top:6px;overflow:hidden}
.unit .bar i{display:block;height:100%;background:var(--ok);border-radius:4px}
.unit .pct{font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right}
/* unit route */
.guidebtn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1.5px solid var(--sun);background:var(--sun-soft);border-radius:var(--r);padding:11px 14px;margin:4px 0 14px;font-size:1.3rem}
.guidebtn span{display:flex;flex-direction:column;font-size:.95rem;min-width:0}
.guidebtn small{color:var(--muted);font-size:.8rem}
.route{display:flex;flex-direction:column;position:relative}
.route::before{content:"";position:absolute;left:19px;top:22px;bottom:22px;width:2px;background:var(--line)}
.les{position:relative;display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:12px;align-items:center;text-align:left;background:none;border:0;padding:8px 0;width:100%}
.les .dot{width:40px;height:40px;border-radius:50%;background:var(--surface);border:2px solid var(--line);display:grid;place-items:center;font-size:1.1rem;color:var(--muted);z-index:1}
.les.done .dot{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.les.cur .dot{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.les .lt{display:flex;flex-direction:column;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 12px}
.les.cur .lt{border-color:var(--accent)}
.les .lt small{color:var(--muted);font-size:.8rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stars{display:flex;gap:1px;font-size:.95rem;color:var(--line);min-width:48px;justify-content:flex-end}
.stars i.on{color:var(--sun)}
.stars em{font-style:normal;font-size:.78rem;font-weight:700;color:var(--accent)}
/* intro */
.words{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.word{display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;width:100%}
.word span{display:flex;flex-direction:column;min-width:0}
.word i{font-size:.82rem;color:var(--sun)}
.word .g{text-align:right;font-size:.92rem;color:var(--muted)}
.rules{padding-left:20px;margin:10px 0 16px}.rules li{margin:5px 0}
.vt{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-top:10px;overflow:hidden}
.vh{display:flex;align-items:center;gap:8px;padding:9px 12px;background:var(--accent-soft);flex-wrap:wrap}
.vh span{font-size:.82rem;color:var(--muted);flex:1;min-width:0}
.vt table{width:100%;border-collapse:collapse}
.vt td{padding:6px 12px;border-top:1px solid var(--line);font-size:.95rem}
.vt td:first-child{color:var(--muted);width:48%}
/* free practice */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:.88rem;font-weight:500}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.ugrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:10px}
.ub{aspect-ratio:1;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;font-family:var(--f-display);font-weight:700;font-size:1.05rem}
.ub[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.toggles{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.tog{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;text-align:left;font-size:.9rem;font-weight:500}
.tog::before{content:"";width:18px;height:18px;border-radius:5px;border:2px solid var(--line);flex:none}
.tog[aria-pressed="true"]{border-color:var(--accent)}
.tog[aria-pressed="true"]::before{background:var(--accent);border-color:var(--accent);box-shadow:inset 0 0 0 3px var(--surface)}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;padding:9px 6px;font-size:.9rem;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--ink);font-weight:600}
/* docks & nav */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:6;background:linear-gradient(to top,var(--bg) 72%,transparent);padding-top:18px;padding-bottom:max(14px,env(safe-area-inset-bottom,0px))}
.dock.up{bottom:calc(62px + env(safe-area-inset-bottom,0px));padding-bottom:10px}
.dock .in,.nav .in{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.dock .in{display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:8px}
.btn{border:0;border-radius:14px;padding:14px 16px;font-weight:600;font-size:1rem;background:var(--accent);color:var(--accent-ink);width:100%}
.btn.sec{background:var(--surface);color:var(--ink);border:1.5px solid var(--line)}
.btn.ok{background:var(--ok);color:var(--surface)}.btn.bad{background:var(--bad);color:var(--surface)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn .n{display:inline-block;min-width:22px;padding:0 6px;border-radius:999px;background:var(--bad);color:#fff;font-size:.78rem;margin-left:6px}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav .in{display:grid;grid-template-columns:repeat(4,1fr)}
.nav button{position:relative;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 2px 8px;font-size:.72rem;font-weight:600;color:var(--muted)}
.nav button svg{font-size:1.35rem}
.nav button[aria-current="true"]{color:var(--accent)}
.nav i{position:absolute;top:5px;left:calc(50% + 6px);font-style:normal;background:var(--bad);color:#fff;border-radius:999px;font-size:.66rem;min-width:17px;padding:0 4px;line-height:17px;text-align:center}
/* quiz */
.qtop{display:flex;align-items:center;gap:12px;width:100%}
.x{border:1px solid var(--line);background:var(--surface);border-radius:10px;width:38px;height:38px;flex:none;font-size:1.1rem;display:grid;place-items:center}
.prog{flex:1;height:8px;background:var(--line);border-radius:8px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--ok);transition:width .25s}
.cnt{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums;min-width:44px;text-align:right}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px 16px;margin-top:6px}
.card.center{text-align:center}
.lbl{display:inline-flex;gap:6px;align-items:center;font-size:.74rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.lbl em{font-style:normal;background:var(--sun-soft);color:var(--ink);border-radius:6px;padding:2px 7px;letter-spacing:.04em}
.lbl em.re{background:var(--bad-soft)}
.prompt{font-family:var(--f-display);font-size:1.55rem;line-height:1.25;margin:12px 0 4px;overflow-wrap:anywhere;text-wrap:balance}
.prompt.big{font-size:2.6rem;font-variant-numeric:tabular-nums}.prompt.sm{font-size:1.35rem}
.blank{display:inline-block;min-width:56px;border-bottom:3px solid var(--sun);margin:0 2px}
.pron{color:var(--sun);font-style:italic;font-size:.95rem}
.say{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 12px;font-size:.85rem;font-weight:600;display:inline-flex;align-items:center;gap:6px;margin-top:10px}
.say.sm{margin:0;padding:6px 9px}
.audio{display:flex;align-items:center;gap:12px;margin:14px 0 4px}
.play{width:72px;height:72px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);font-size:2rem;display:grid;place-items:center}
.audio .say{margin:0}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.opts.two{flex-direction:row}.opts.two .opt{flex:1;text-align:center;font-family:var(--f-display);font-size:1.4rem;font-weight:700}
.opt{text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:13px 14px;font-size:1.02rem;min-height:50px}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}
.inp{width:100%;font:inherit;font-size:1.15rem;padding:13px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);margin-top:14px}
.keys{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.key{border:1px solid var(--line);background:var(--surface);border-radius:9px;min-width:40px;height:40px;font-size:1.05rem;font-weight:600}
.skip{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:.88rem;padding:8px 0;margin-top:4px;display:block}
.built{min-height:58px;border-bottom:2px solid var(--line);display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 0;margin-top:12px}
.built.ok{border-color:var(--ok)}.built.bad{border-color:var(--bad)}
.built .ph{color:var(--muted);font-size:.9rem}
.tiles{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.tile{border:1.5px solid var(--line);border-bottom-width:3px;background:var(--surface);border-radius:11px;padding:8px 12px;font-size:1.02rem;min-height:42px}
.tile.used{color:transparent;background:var(--line);border-color:var(--line)}
.match{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.match>div{display:flex;flex-direction:column;gap:8px;min-width:0}
.mt{border:1.5px solid var(--line);border-bottom-width:3px;background:var(--surface);border-radius:12px;padding:9px 8px;min-height:56px;font-size:.92rem;overflow-wrap:anywhere}
.mt.sel{border-color:var(--accent);background:var(--accent-soft)}
.mt.ok{border-color:var(--ok);background:var(--ok-soft);opacity:.55}
.mt.bad{border-color:var(--bad);background:var(--bad-soft)}
.fb{border-radius:16px;padding:14px 16px;margin-top:12px;border:1.5px solid}
.fb.ok{background:var(--ok-soft);border-color:var(--ok)}.fb.bad{background:var(--bad-soft);border-color:var(--bad)}
.fb b.h{display:block;font-size:1.05rem;margin-bottom:4px}
.fb .ans{font-family:var(--f-display);font-size:1.2rem;font-weight:700;overflow-wrap:anywhere}
.fb .you{font-family:var(--f-display);font-size:1.2rem;overflow-wrap:anywhere}
.cmp{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;align-items:baseline}
.cmp span{font-size:.76rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
mark{background:none;color:inherit}
mark.dx{color:var(--bad);text-decoration:line-through;text-decoration-thickness:2px}
mark.dn{color:var(--ok);text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}
.fb .tr{margin-top:6px;font-size:.92rem}
.fb .ex{margin-top:4px;font-size:.88rem;color:var(--muted)}
.fb .acc{margin-top:6px;font-size:.88rem;background:var(--sun-soft);border-radius:8px;padding:6px 9px}
.more{margin-top:8px}.more summary{cursor:pointer;font-size:.9rem;font-weight:600;padding:6px 0}
/* results */
.bigstars{display:flex;justify-content:center;gap:6px;font-size:2.4rem;color:var(--line)}.bigstars i.on{color:var(--sun)}
.score{font-family:var(--f-display);font-size:3.2rem;font-weight:700;line-height:1;margin:8px 0 4px;font-variant-numeric:tabular-nums}
.gain{display:flex;justify-content:center;gap:18px;margin-top:12px;font-weight:600;font-size:.95rem}.gain>span{display:inline-flex;align-items:center;gap:5px}
.wrong{display:flex;flex-direction:column;gap:6px}
.wrong div{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--bad);border-radius:10px;padding:9px 12px;font-size:.92rem}
.wrong div span{display:block;color:var(--muted);font-size:.84rem}
/* review */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 12px 10px;height:118px}
.week div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;height:100%}
.week i{width:100%;max-width:26px;border-radius:6px;background:var(--line)}
.week i.some{background:var(--accent)}.week i.hit{background:var(--ok)}
.week span{font-size:.72rem;color:var(--muted)}
.tbl{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.trow{display:grid;grid-template-columns:22px minmax(0,1fr) auto auto 38px;gap:8px;align-items:center;padding:8px 12px;border-top:1px solid var(--line);font-size:.82rem}
.trow:first-child{border-top:0}
.trow b{font-family:var(--f-display)}.trow span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trow em{font-style:normal;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
/* theory */
.th{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-top:10px}
.th h3{font-family:var(--f-display);font-size:1.15rem;margin:0 0 6px}
.th p{margin:6px 0;font-size:.95rem}
.tw{overflow-x:auto;margin:8px 0}
.th table{border-collapse:collapse;width:100%;font-size:.9rem}
.th th{text-align:left;font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:5px 8px;border-bottom:2px solid var(--line);white-space:nowrap}
.th td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.th td:first-child{color:var(--muted)}
.exs{display:flex;flex-direction:column;gap:5px;margin-top:8px}
.exr{display:flex;flex-direction:column;text-align:left;border:0;border-left:3px solid var(--accent);background:var(--bg);border-radius:0 9px 9px 0;padding:7px 11px;width:100%}
.exr span{font-size:.86rem;color:var(--muted)}
.tip{background:var(--sun-soft);border-radius:10px;padding:8px 11px;margin-top:10px;font-size:.9rem}
/* flashcards */
.flash{perspective:1200px;margin-top:8px}
.fc{position:relative;height:300px;transition:transform .45s;transform-style:preserve-3d;cursor:pointer}
.fc.flip{transform:rotateY(180deg)}

e","vive"],["nosotros/as","hablamos","comemos","vivimos"],["vosotros/as","habláis","coméis","vivís"],["ellos / ustedes","hablan","comen","viven"]],"tip":"Το «εγώ» τελειώνει πάντα σε -o. Τα -er και -ir διαφέρουν μόνο στο nosotros και στο vosotros."},{"h":"Αυτοπαθή ρήματα (-se)","p":["Μοιάζουν με τα ελληνικά σε -ομαι. Κλίνονται κανονικά, με [[me, te, se, nos, os, se]] μπροστά."],"t":[["","levantarse"],["yo","me levanto"],["tú","te levantas"],["él / ella","se levanta"],["nosotros","nos levantamos"],["vosotros","os levantáis"],["ellos","se levantan"]],"ex":[["Me levanto a las siete y me ducho.","Σηκώνομαι στις επτά και κάνω ντους."]]}],"3":[{"h":"Es · hay · está","t":[["","Τι δείχνει","Τι ακολουθεί"],["es / son","περιγραφή: πώς ή τι είναι","επίθετο, un/una + ουσιαστικό"],["hay","ύπαρξη: υπάρχει, υπάρχουν","un/una, αριθμός, muchos, χωρίς άρθρο"],["está / están","θέση: πού βρίσκεται","el/la/los/las, mi/tu, όνομα"]],"ex":[["Mi barrio es tranquilo.","Η γειτονιά μου είναι ήσυχη."],["Hay un parque.","Υπάρχει ένα πάρκο."],["El parque está cerca.","Το πάρκο είναι κοντά."]],"tip":"Ποτέ «hay el parque». Με [[el/la]] πάει το [[está]], με [[un/una]] πάει το [[hay]]."},{"h":"Τα άρθρα","t":[["","Οριστικό","Αόριστο"],["αρσενικό ενικός","el","un"],["θηλυκό ενικός","la","una"],["αρσενικό πληθυντικός","los","unos"],["θηλυκό πληθυντικός","las","unas"]],"p":["[[a + el = al]], [[de + el = del]]. Το [[unos]] πριν από αριθμό σημαίνει «περίπου»: [[a unos diez minutos]]. Χώρες και πόλεις δεν παίρνουν άρθρο: [[Vivo en Tesalónica.]]"]},{"h":"Κατευθύνσεις","p":["[[a]] για κατεύθυνση και απόσταση, [[en]] για θέση, [[de]] μετά από [[cerca, lejos, al lado]]."],"t":[["Ισπανικά","Ελληνικά"],["todo recto","ευθεία"],["a la derecha / a la izquierda","δεξιά / αριστερά"],["al lado de","δίπλα σε"],["al final de","στο τέλος του"],["en la esquina","στη γωνία"],["cerca de / lejos de","κοντά σε / μακριά από"],["a unos 10 minutos a pie","περίπου 10 λεπτά με τα πόδια"]],"ex":[["Sigue todo recto y gira a la derecha.","Συνέχισε ευθεία και στρίψε δεξιά."],["Toma la segunda calle a la izquierda.","Πάρε τον δεύτερο δρόμο αριστερά."]]},{"h":"Τακτικά αριθμητικά","p":["[[primero, segundo, tercero, cuarto, quinto, sexto, séptimo, octavo, noveno, décimo]]. Θηλυκό σε -a: [[la primera calle]]."],"tip":"Πριν από αρσενικό ουσιαστικό: [[primero → primer]], [[tercero → tercer]]: [[el tercer piso]]."},{"h":"Ερωτηματικές λέξεις","t":[["Ισπανικά","Ελληνικά"],["¿Qué?","Τι;"],["¿Cómo?","Πώς;"],["¿Dónde? / ¿De dónde?","Πού; / Από πού;"],["¿Cuál? / ¿Cuáles?","Ποιο; / Ποια;"],["¿Cuánto/a? ¿Cuántos/as?","Πόσο; Πόσοι;"],["¿Quién? / ¿Quiénes?","Ποιος; / Ποιοι;"],["¿Cuándo?","Πότε;"],["¿Por qué?","Γιατί;"]],"tip":"Όλες γράφονται με τόνο και με ¿ στην αρχή της ερώτησης."}],"4":[{"h":"Κτητικά","p":["Μπαίνουν πριν από το ουσιαστικό και συμφωνούν με αυτό που έχουμε, όχι με τον κάτοχο."],"t":[["","ενικός","πληθυντικός"],["μου","mi","mis"],["σου","tu","tus"],["του / της / σας","su","sus"],["μας","nuestro/a","nuestros/as"],["σας (vosotros)","vuestro/a","vuestros/as"],["τους","su","sus"]],"ex":[["Mi hermano y mis hermanas.","Ο αδελφός μου και οι αδελφές μου."],["Nuestra casa es grande.","Το σπίτι μας είναι μεγάλο."]],"tip":"[[tu]] χωρίς τόνο = σου. [[tú]] με τόνο = εσύ."},{"h":"Δεικτικά","t":[["","αρσ.","θηλ.","αρσ. πληθ.","θηλ. πληθ."],["εδώ","este","esta","estos","estas"],["εκεί","ese","esa","esos","esas"],["εκεί πέρα","aquel","aquella","aquellos","aquellas"]],"ex":[["Este es mi padre.","Αυτός είναι ο πατέρας μου."],["Aquella casa es muy antigua.","Εκείνο το σπίτι είναι πολύ παλιό."]]},{"h":"Επίθετα και ένταση","p":["Το επίθετο συμφωνεί σε γένος και αριθμό: [[simpático, simpática, simpáticos, simpáticas]]. Όσα τελειώνουν σε -e ή σύμφωνο δεν αλλάζουν στο θηλυκό, εκτός από τα -or: [[trabajador → trabajadora]].","[[muy]] + επίθετο = πολύ. [[bastante]] = αρκετά. [[un poco]] = λίγο."],"ex":[["Mi hermana es muy simpática.","Η αδελφή μου είναι πολύ συμπαθητική."],["Es un poco tímido.","Είναι λίγο ντροπαλός."]]},{"h":"Ρήματα με αλλαγή στη ρίζα","p":["Η ρίζα αλλάζει όταν πέφτει πάνω της ο τόνος: σε όλα τα πρόσωπα εκτός από nosotros και vosotros."],"t":[["","querer (e→ie)","poder (o→ue)","pedir (e→i)"],["yo","quiero","puedo","pido"],["tú","quieres","puedes","pides"],["él / ella","quiere","puede","pide"],["nosotros","queremos","podemos","pedimos"],["vosotros","queréis","podéis","pedís"],["ellos","quieren","pueden","piden"]],"tip":"Μερικά έχουν ανώμαλο «εγώ»: [[tengo, vengo, digo, hago, salgo, conozco, sé]]."}],"5":[{"h":"Gustar = μου αρέσει","p":["Λειτουργεί όπως στα ελληνικά: αυτό που αρέσει ορίζει αν θα πούμε [[gusta]] ή [[gustan]]."],"t":[["","","ενικός ή απαρέμφατο","πληθυντικός"],["(a mí)","me","gusta","gustan"],["(a ti)","te","gusta","gustan"],["(a él / ella / usted)","le","gusta","gustan"],["(a nosotros)","nos","gusta","gustan"],["(a vosotros)","os","gusta","gustan"],["(a ellos / ustedes)","les","gusta","gustan"]],"ex":[["Me gusta el cine.","Μου αρέσει το σινεμά."],["Me gustan los conciertos.","Μου αρέσουν οι συναυλίες."],["¿Te gusta bailar?","Σου αρέσει να χορεύεις;"],["A Ana le gusta leer.","Στην Άννα αρέσει το διάβασμα."]]},{"h":"Συμφωνώ και διαφωνώ","t":[["Λέει ο άλλος","Συμφωνώ","Διαφωνώ"],["Me gusta el fútbol.","A mí también.","A mí no."],["No me gusta el café.","A mí tampoco.","A mí sí."]]},{"h":"Ir: πού πάω και πώς","p":["[[ir a]] + μέρος. Μέσο μεταφοράς με [[en]], αλλά [[a pie]] (με τα πόδια). [[ir a]] + απαρέμφατο = θα κάνω κάτι."],"t":[["","ir"],["yo","voy"],["tú","vas"],["él / ella","va"],["nosotros","vamos"],["vosotros","vais"],["ellos","van"]],"ex":[["Voy al cine en autobús.","Πάω σινεμά με το λεωφορείο."],["Mañana voy a estudiar.","Αύριο θα διαβάσω."]]},{"h":"Estar + gerundio: τώρα","p":["Για κάτι που γίνεται αυτή τη στιγμή. -ar → [[-ando]], -er/-ir → [[-iendo]]."],"ex":[["Estoy comiendo.","Τρώω (τώρα)."],["Está leyendo un libro.","Διαβάζει ένα βιβλίο."]],"tip":"Ανώμαλα: [[leer → leyendo]], [[dormir → durmiendo]], [[decir → diciendo]], [[ir → yendo]]."},{"h":"Ανώμαλα: hacer, salir, preferir, poder","t":[["","hacer","salir","preferir","poder"],["yo","hago","salgo","prefiero","puedo"],["tú","haces","sales","prefieres","puedes"],["él / ella","hace","sale","prefiere","puede"],["nosotros","hacemos","salimos","preferimos","podemos"]]}],"6":[{"h":"Χρώματα","p":["Συμφωνούν με το ουσιαστικό όπως τα επίθετα: [[rojo, roja, rojos, rojas]]. Όσα τελειώνουν σε -e ή σύμφωνο αλλάζουν μόνο στον πληθυντικό: [[verde → verdes]], [[azul → azules]]. Τα [[naranja]] και [[rosa]] μένουν ίδια στο γένος."],"ex":[["Una camisa blanca y unos zapatos negros.","Ένα άσπρο πουκάμισο και μαύρα παπούτσια."]]},{"h":"Περιγραφή: ser, tener, llevar","t":[["Ρήμα","Για τι","Παράδειγμα"],["ser","σώμα, χαρακτήρας","Es alto y delgado."],["tener","μάτια, μαλλιά","Tiene los ojos verdes."],["llevar","ρούχα, γυαλιά, γένια","Lleva gafas y una chaqueta."]],"tip":"[[el pelo]] είναι αρσενικό και ενικός: [[Tiene el pelo rubio.]]"},{"h":"Υποχρέωση και ανάγκη","p":["[[tener que]] + απαρέμφατο = πρέπει. [[deber]] + απαρέμφατο = οφείλω, καλό είναι να. [[necesitar]] + ουσιαστικό ή απαρέμφατο = χρειάζομαι."],"ex":[["Tengo que trabajar.","Πρέπει να δουλέψω."],["Debes descansar.","Πρέπει να ξεκουραστείς."],["Necesito un abrigo.","Χρειάζομαι ένα παλτό."]]},{"h":"Ο καιρός","t":[["Ισπανικά","Ελληνικά"],["Hace frío / calor","Κάνει κρύο / ζέστη"],["Hace sol / viento","Έχει ήλιο / Φυσάει"],["Llueve","Βρέχει"],["Nieva","Χιονίζει"],["Está nublado","Έχει συννεφιά"]],"p":["Εποχές: [[la primavera, el verano, el otoño, el invierno]]. Με μήνες και εποχές βάζουμε [[en]]: [[en mayo, en verano]]."]},{"h":"Αριθμοί 100–1000","p":["100 = [[cien]], αλλά 101–199 = [[ciento …]]: [[ciento cincuenta]]. Οι εκατοντάδες συμφωνούν στο γένος: [[doscientos euros, doscientas personas]].","200 [[doscientos]], 300 [[trescientos]], 400 [[cuatrocientos]], 500 [[quinientos]], 600 [[seiscientos]], 700 [[setecientos]], 800 [[ochocientos]], 900 [[novecientos]], 1000 [[mil]]."]}],"7":[{"h":"Es bueno + απαρέμφατο","p":["Γενικές συμβουλές: [[es bueno / es malo / es necesario / es importante]] + απαρέμφατο."],"ex":[["Es bueno beber agua.","Είναι καλό να πίνεις νερό."],["Es malo comer mucho azúcar.","Είναι κακό να τρως πολλή ζάχαρη."]]},{"h":"Ανώμαλα ρήματα της ρουτίνας","t":[["","acostarse (o→ue)","vestirse (e→i)","reírse","dar"],["yo","me acuesto","me visto","me río","doy"],["tú","te acuestas","te vistes","te ríes","das"],["él / ella","se acuesta","se viste","se ríe","da"],["nosotros","nos acostamos","nos vestimos","nos reímos","damos"],["vosotros","os acostáis","os vestís","os reís","dais"],["ellos","se acuestan","se visten","se ríen","dan"]]},{"h":"Ποσότητα: mucho, bastante, poco, nada","p":["Με ουσιαστικό συμφωνούν: [[mucho pan, mucha agua, muchos huevos, muchas verduras]]. Με ρήμα μένουν ίδια: [[Como mucho.]] Με επίθετο λέμε [[muy]]: [[muy sano]].","[[no … nada]] = καθόλου: [[No como nada de carne.]]"],"tip":"[[el agua]] παίρνει el, αλλά είναι θηλυκό: [[mucha agua]]."},{"h":"Στο εστιατόριο","ex":[["De primero, ensalada.","Για πρώτο πιάτο, σαλάτα."],["De segundo, pescado.","Για δεύτερο, ψάρι."],["De postre, fruta.","Για επιδόρπιο, φρούτα."],["La cuenta, por favor.","Τον λογαριασμό, παρακαλώ."]],"p":["Σύνδεσμοι: [[y]] = και, [[pero]] = αλλά, [[o]] = ή."]}],"8":[{"h":"Παρακείμενος: haber + μετοχή","p":["Για εμπειρίες και για ό,τι έγινε σε χρόνο που δεν έχει τελειώσει (σήμερα, αυτή την εβδομάδα). Μετοχή: -ar → [[-ado]], -er/-ir → [[-ido]]."],"t":[["","haber","+ μετοχή"],["yo","he","hablado"],["tú","has","comido"],["él / ella","ha","vivido"],["nosotros","hemos","viajado"],["vosotros","habéis","estado"],["ellos","han","tenido"]],"ex":[["He estado en México.","Έχω πάει στο Μεξικό."],["¿Has visto esta película?","Έχεις δει αυτή την ταινία;"]],"tip":"Τα [[he]] και η μετοχή δεν χωρίζονται ποτέ: [[Me he levantado]], [[No he comido]]."},{"h":"Ανώμαλες μετοχές","t":[["Ρήμα","Μετοχή"],["hacer","hecho"],["ver","visto"],["escribir","escrito"],["decir","dicho"],["poner","puesto"],["volver","vuelto"],["abrir","abierto"],["romper","roto"]]},{"h":"Λέξεις που πάνε με τον παρακείμενο","p":["[[hoy, esta mañana, esta semana, este año, alguna vez, nunca, ya, todavía no]]."],"ex":[["¿Has estado alguna vez en España?","Έχεις πάει ποτέ στην Ισπανία;"],["Nunca he comido paella.","Δεν έχω φάει ποτέ παέγια."],["Todavía no he terminado.","Δεν έχω τελειώσει ακόμα."]]},{"h":"Hace, desde, desde hace","t":[["","Ακολουθεί","Παράδειγμα"],["desde","χρονικό σημείο","Vivo aquí desde 2020."],["desde hace","διάστημα","Estudio español desde hace dos meses."],["hace … que","διάστημα","Hace dos meses que estudio español."]]}],"9":[{"h":"Doler = πονάει","p":["Κλίνεται όπως το gustar: [[me duele]] + ενικός, [[me duelen]] + πληθυντικός."],"ex":[["Me duele la cabeza.","Πονάει το κεφάλι μου."],["Me duelen los pies.","Πονάνε τα πόδια μου."],["¿Te duele la garganta?","Σε πονάει ο λαιμός σου;"],["A mi madre le duele la espalda.","Τη μητέρα μου την πονάει η πλάτη."]],"tip":"Στα μέρη του σώματος μπαίνει άρθρο, όχι κτητικό: [[Me duele la cabeza]], όχι «mi cabeza»."},{"h":"Tener και estar για την υγεία","t":[["tener + ουσιαστικό","estar + επίθετο"],["tener fiebre (πυρετό)","estar enfermo/a (άρρωστος)"],["tener tos (βήχα)","estar resfriado/a (κρυωμένος)"],["tener dolor de cabeza","estar cansado/a (κουρασμένος)"],["tener gripe (γρίπη)","estar mareado/a (ζαλισμένος)"]],"ex":[["¿Qué te pasa? – Me encuentro mal.","Τι έχεις; – Αισθάνομαι άσχημα."]]},{"h":"Συμβουλές","p":["[[deber / tener que / poder]] + απαρέμφατο."],"ex":[["Debes ir al médico.","Πρέπει να πας στον γιατρό."],["Tienes que descansar.","Πρέπει να ξεκουραστείς."],["Puedes tomar una infusión.","Μπορείς να πιεις ένα τσάι βοτάνων."]]},{"h":"Υποθέσεις και σύνδεσμοι","p":["[[a lo mejor]] + οριστική = ίσως. Σύνδεσμοι: [[y]] (και), [[pero]] (αλλά), [[porque]] (επειδή), [[por eso]] (γι' αυτό)."],"ex":[["A lo mejor tienes gripe.","Μπορεί να έχεις γρίπη."],["Estoy enfermo, por eso no voy a clase.","Είμαι άρρωστος, γι' αυτό δεν πάω στο μάθημα."]],"ti /* ---------- vocabulary answer variants: "el/la abuelo/a" → abuelo, abuela, el abuelo ... ---------- */
function variants(es){
  if (/^el\/la /.test(es)){
    const r = es.slice(6), m = r.replace(/o\/a\b/g,'o').replace(/\/-a\b/g,''), f = r.replace(/o\/a\b/g,'a').replace(/\/-a\b/g,'a');
    return [...new Set([es, ...variants('el '+m), ...variants('la '+f)])];
  }
  const out = new Set([es]);
  const parts = es.split(/\s+/);
  let combos = [[]];
  for (const p of parts){
    let opts;
    if (p === 'el/la') opts = ['el','la',''];
    else if (/^[^/]+\/-a$/.test(p)) { const b=p.split('/')[0]; opts=[b, b+'a']; }
    else if (/^[^/]+o\/a$/.test(p)) { const b=p.slice(0,-2); opts=[b, b.slice(0,-1)+'a']; }
    else if (/^[^/]+\/[^/]+$/.test(p)) opts = p.split('/');
    else opts = [p];
    const n=[]; for (const c of combos) for (const o of opts) n.push(o ? c.concat(o) : c); combos = n;
  }
  for (const c of combos){ const s=c.join(' ').replace(/,$/,''); out.add(s); out.add(s.replace(/^(el|la|los|las|un|una) /,'')); }
  es.split(/,\s*/).forEach(x => { out.add(x); out.add(x.replace(/^(el|la|los|las) /,'')); });
  return [...out].filter(Boolean);
}

/* ---------- approximate Greek-letter pronunciation (Spain) ---------- */
const VOW = {a:'α',e:'ε',i:'ι',o:'ο',u:'ου','á':'α','é':'ε','í':'ι','ó':'ο','ú':'ου','ü':'ου'};
const ACC = {'α':'ά','ε':'έ','ι':'ί','ο':'ό','ου':'ού'};
const PRON_EX = {'méxico':'μέχικο','mexicano':'μεχικάνο','mexicana':'μεχικάνα','mexicanos':'μεχικάνος'};
function pronWord(w){
  w = w.toLowerCase(); if (PRON_EX[w]) return PRON_EX[w];
  const T = []; // tokens {g, v:bool, strong, written}
  const isV = c => 'aeiouáéíóúü'.includes(c);
  for (let i=0;i<w.length;i++){
    const c=w[i], n=w[i+1]||'', p=w[i-1]||'';
    if (isV(c)) { T.push({g:VOW[c], v:true, strong:'aeoáéó'.includes(c), written:'áéíóú'.includes(c)}); continue; }
    if (c==='y'){ if (i===w.length-1 || !isV(n)) T.push({g:'ι',v:true,strong:false}); else T.push({g:'γι'}); continue; }
    if (c==='c'){ if (n==='h'){T.push({g:'τσ'});i++;continue;} T.push({g:'eéiíé'.includes(n)?'θ':'κ'}); continue; }
    if (c==='q'){ T.push({g:'κ'}); if (n==='u') i++; continue; }
    if (c==='g'){ if (n==='u' && 'eéií'.includes(w[i+2]||'')){ T.push({g:'γκ'}); i++; continue; }
                 if ('eéií'.includes(n)) { T.push({g:'χ'}); continue; }
                 T.push({g:(i===0||p==='n')?'γκ':'γ'}); continue; }
    if (c==='l' && n==='l'){ T.push({g:'γι'}); i++; continue; }
    if (c==='r'){ if (n==='r'){T.push({g:'ρρ'});i++;continue;} T.push({g:(i===0||'nls'.includes(p))?'ρρ':'ρ'}); continue; }
    if (c==='d'){ T.push({g:(i===0||'nl'.includes(p))?'ντ':'δ'}); continue; }
    const M = {b:'μπ',v:'μπ',f:'φ',h:'',j:'χ',k:'κ',l:'λ',m:'μ',n:'ν','ñ':'νι',p:'π',s:'σ',t:'τ',x:'ξ',z:'θ',w:'ου'};
    T.push({g: M[c] ?? ''});
  }
  // nuclei
  const nuc = []; let k=0;
  while (k<T.length){
    if (!T[k].v){k++;continue;}
    let grp=[k]; k++;
    while (k<T.length && T[k].v){
      const prev=T[grp[grp.length-1]], cur=T[k];
      if ((prev.strong && cur.strong) || prev.written&&!prev.strong&&cur.strong || cur.written&&!cur.strong) break;
      grp.push(k); k++;
    }
    nuc.push(grp);
  }
  if (!nuc.length) return T.map(t=>t.g).join('');
  let si = nuc.findIndex(g => g.some(i=>T[i].written));
  if (si<0){ const last=w[w.length-1]; si = (nuc.length===1)?0:('aeiouns'.includes(last)? nuc.length-2 : nuc.length-1); }
  const g = nuc[si]; let vi = g.find(i=>T[i].written);
  if (vi===undefined){ const st=g.filter(i=>T[i].strong); vi = st.length? st[0] : g[g.length-1]; }
  const mono = nuc.length===1;
  // write diaeresis for a/e/o + ι that would read as Greek digraph
  for (let i=1;i<T.length;i++) if (T[i].g==='ι' && T[i].v && T[i-1].v && ['α','ε','ο'].includes(T[i-1].g) && i!==vi && i-1!==vi) T[i].g='ϊ';
  if (!mono || g.length>1){ const pv=T[vi-1]; T[vi].g = (T[vi].g==='ι' && pv && pv.v && ['α','ε','ο'].includes(pv.g)) ? 'ΐ' : (ACC[T[vi].g] || T[vi].g); }
  let s = T.map(t=>t.g).join('');
  return s.replace(/σ$/,'ς');
}

function lessonQs(L){
  const u = L.u, m = SET.mode, alt = i => m==='type' ? true : m==='mc' ? false : i%2===1, qs = [];
  if (L.k === 'V'){
    shuffle(L.ix).forEach(i => qs.push(qVocab(u, i, 'eg')));
    qs.push(qMatch(u, shuffle(L.ix).slice(0,5)));
    shuffle(L.ix).forEach((i,k) => qs.push(qVocab(u, i, alt(k) ? 'ge-type' : 'ge-mc')));
    if (audioOn()) shuffle(L.ix).slice(0,2).forEach(i => qs.push(qVocab(u, i, 'listen')));
    shuffle(L.ix.filter(i => genderable(u,i))).slice(0,2).forEach(i => qs.push(qGender(u, i)));
  } else if (L.k === 'C'){
    L.ix.forEach(i => { const impv = VB[u][i].t==='impv'; (impv ? [0,0] : shuffle(range(6)).slice(0,4)).forEach((p,k) => qs.push(qVerb(u, i, p, alt(k)))); });
    return shuffle(qs);
  } else if (L.k === 'F'){
    L.ix.forEach((i,k) => qs.push(qFill(u, i, alt(k) ? 'type' : 'mc')));
    const b = shuffle(L.ix).filter(i => bankable(fillSentence(F[u][i]))).slice(0,3).map(i => qFill(u, i, 'bank'));
    return shuffle(qs).concat(b);
  } else if (L.k === 'P'){
    L.ix.forEach(i => qs.push(qPhrase(u, i, 'bank')));
    L.ix.forEach(i => qs.push(qPhrase(u, i, m==='mc' ? 'mc' : 'type')));
    if (audioOn()) shuffle(L.ix).slice(0,2).forEach(i => qs.push(qPhrase(u, i, 'listen')));
  } else if (L.k === 'N'){
    const seen = new Set(); while (seen.size < 10) seen.add(L.lo + rnd(L.hi - L.lo + 1));
    [...seen].forEach((n,k) => qs.push(qNum(u, n, (audioOn() && k%4===3) ? 'listen' : alt(k) ? 'type' : 'mc')));

    const seen = new Set(['1|0','3|15','6|30','8|45']); while (seen.size < 10) seen.add((1+rnd(12))+'|'+(5*rnd(12)));

function poolFor(units, types){
  const pools = {};
  const add = (k, id) => (pools[k] = pools[k] || []).push(id);
  for (const u of units){
    if (types.includes('v')) (V[u]||[]).forEach((_,i) => add('v', `v|${u}|${i}`));
    if (types.includes('g')) (V[u]||[]).forEach((_,i) => { if (genderable(u,i)) add('g', `g|${u}|${i}`); });
    if (types.includes('c')) (VB[u]||[]).forEach((vb,i) => add('c', `c|${u}|${i}|${vb.t==='impv'?0:rnd(6)}`));
    if (types.includes('f')) (F[u]||[]).forEach((_,i) => add('f', `f|${u}|${i}`));
    if (types.includes('p')) (P[u]||[]).forEach((_,i) => add('p', `p|${u}|${i}`));
    if (types.includes('n')){
      if (u===2){ for (let k=0;k<8;k++) add('n', `n|2|${rnd(31)}`); for (let k=0;k<12;k++) add('n', `t|${1+rnd(12)}|${5*rnd(12)}`); }
      if (u===3) for (let k=0;k<12;k++) add('n', `n|3|${31+rnd(70)}`);
      if (u===6) for (let k=0;k<12;k++) add('n', `n|6|${101+rnd(900)}`);
    }
  }
  return pools;
}
function pickMixed(pools, n){
  const keys = Object.keys(pools).filter(k => pools[k].length), ids = []; let r = 0;
  for (const k of keys) pools[k] = shuffle(pools[k]);
  const w = {v:3, f:3, c:2, p:2, n:1, g:1}, order = keys.flatMap(k => Array(w[k]||1).fill(k));
  while (ids.length < n && keys.some(k => pools[k].length)){ const k = order[r++ % order.length]; if (pools[k].length) ids.push(pools[k].pop()); }
  return shuffle(ids);
}

/* ================= diff for typed answers ================= */
function lcs(a, b){
  const n=a.length, m=b.length, T=Array.from({length:n+1}, ()=>new Uint16Array(m+1));
  for (let i=n-1;i>=0;i--) for (let j=m-1;j>=0;j--) T[i][j] = a[i]===b[j] ? T[i+1][j+1]+1 : Math.max(T[i+1][j], T[i][j+1]);
  const ka=new Array(n).fill(false), kb=new Array(m).fill(false); let i=0, j=0;
  while (i<n && j<m){ if (a[i]===b[j]){ ka[i]=kb[j]=true; i++; j++; } else if (T[i+1][j] >= T[i][j+1]) i++; else j++; }
  return {ka, kb, len:T[0][0]};
}
function diffHtml(user, answers){
  const u = user.trim(); if (!u) return null;
  let best = null;
  for (const a of answers.slice(0,8)){ const t = a.replace(/[¿?¡!.]/g,''); const r = lcs(u.toLowerCase(), t.toLowerCase()); const score = r.len*2 - u.length - t.length; if (!best || score > best.score) best = {t, r, score}; }
  const mark = (s, keep, cls) => { let h='', open=false; for (let k=0;k<s.length;k++){ const bad = !keep[k] && s[k] !== ' '; if (bad && !open){ h += `<mark class="${cls}">`; open=true; } if (!bad && open){ h += '</mark>'; open=false; } h += esc(s[k]); } return h + (open?'</mark>':''); };
  return {you: mark(u, best.r.ka, 'dx'), ok: mark(best.t, best.r.kb, 'dn'), target: best.t};
}

  <h2>Ανά κεφάλαιο</h2>
  <div class="tbl">${UNITS.map(u => { const p = ST.prog[u], [a,b] = unitDone(u), lw = learned(u), tw = (V[u]||[]).length;
    return `<div class="trow"><b>${u}</b><span>${esc(DATA.units[u].es)}</span><em>${a}/${b} μαθ.</em><em>${lw}/${tw} λέξεις</em><em>${p&&p.a?Math.round(100*p.c/p.a)+'%':'–'}</em></div>`; }).join('')}</div>
  <p class="note">«Λέξεις» = όσες έχεις απαντήσει σωστά τουλάχιστον δύο φορές. Το ποσοστό είναι οι σωστές απαντήσεις σου.</p>
  </div>${nav()}`;
}
function sectionHtml(s){
  return `<section class="th"><h3>${md(s.h)}</h3>${(s.p||[]).map(p => `<p>${md(p)}</p>`).join('')}
    ${s.t ? `<div class="tw"><table><thead><tr>${s.t[0].map(c => `<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${s.t.slice(1).map(r => `<tr>${r.map((c,k) => `<td${k && !/[α-ωά-ώ]/i.test(c)?' class="es"':''}>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>` : ''}
    ${s.ex ? `<div class="exs">${s.ex.map(([e,g]) => `<button class="exr" data-say="${esc(e)}"><b class="es">${esc(e)}</b><span>${esc(g)}</span></button>`).join('')}</div>` : ''}
    ${s.tip ? `<div class="tip">${md(s.tip)}</div>` : ''}</section>`;
}
function guideView(){
  return `<div class="wrap">${head('Θεωρία', 'Σύντομοι κανόνες με παραδείγματα')}
  <div class="units" style="margin-top:6px">${UNITS.map(u => `<button class="unit" data-guide="${u}"><span class="in"><span class="num">${u}</span><span class="t"><span class="es">${esc(DATA.units[u].es)}</span><span class="gr">${esc(DATA.units[u].g)}</span></span><span class="pct">${(TH[u]||[]).length} θέματα</span></span></button>`).join('')}</div>
  </div>${nav()}`;
}
function guideUnitView(){
  const u = GUIDE, d = DATA.units[u];
  return `<div class="wrap">${head('Θεωρία · Κεφ. '+u, esc(d.es)+' · '+esc(d.gr), true)}
  ${(TH[u]||[]).map(sectionHtml).join('')}
  ${(VB[u]||[]).length ? `<section class="th"><h3>Ρήματα του κεφαλαίου</h3>${VB[u].map(vb => `<details class="more"><summary><b class="es">${esc(vb.v)}</b> · ${esc(vb.m)}</summary>${verbTable(vb)}</details>`).join('')}</section>` : ''}
  <p class="note">Πάτα ένα παράδειγμα για να το ακούσεις.</p>
  </div>
  <div class="dock"><div class="in"><button class="btn" data-open="${u}">Πήγαινε στα μαθήματα του κεφαλαίου</button></div></div>`;
}
function flashView(){
  const [u,i] = FC.cards[FC.i], [es,gr] = V[u][i];
  return `<div class="wrap quiz">
    <div class="top"><div class="qtop"><button class="x" id="quit" aria-label="Έξοδος">✕</button><div class="prog"><i style="width:${100*(FC.i+1)/FC.cards.length}%"></i></div><span class="cnt">${FC.i+1}/${FC.cards.length}</span></div></div>
    <div class="flash"><div class="fc ${FC.flip?'flip':''}" id="card" role="button" tabindex="0" aria-label="Γύρνα την κάρτα">
      <div class="face"><span class="lbl"><em>Κεφ. ${u}</em></span><div class="w">${esc(es)}</div><div class="pron">≈ ${esc(pron(es))}</div><span class="hint">Πάτα για μετάφραση</span></div>
      <div class="face back"><div class="w" style="font-size:1.6rem">${esc(gr)}</div><div class="sub">${esc(es)}</div></div></div></div>
    <div style="text-align:center">${sayBtn(sayText(es))}</div>
  </div>
  <div class="dock"><div class="in"><div class="row"><button class="btn sec" id="nok">Δεν το ήξερα</button><button class="btn" id="yok">Το ήξερα</button></div></div></div>`;
}
function render(keep){
  const y = window.scrollY;
  app.innerHTML = VIEW==='quiz' ? quizView() : VIEW==='intro' ? introView() : VIEW==='res' ? resultView() : VIEW==='fc' ? flashView() : VIEW==='unit' ? unitView() : VIEW==='guideUnit' ? guideUnitView()
    : TAB==='free' ? freeView() : TAB==='rev' ? revView() : TAB==='guide' ? guideView() : pathView();
  if (VIEW==='quiz' && !ANS){ const i = $('#inp'); if (i && !S.qs[S.i].audio) i.focus({preventScroll:true}); }
  window.scrollTo(0, keep ? y : 0);
}

/* ================= actions ================= */
function goTab(){ VIEW = 'tab'; render(); }
function matchTap(side, k){
  const q = S.qs[S.i]; if (ANS) return;
  if (!MSEL || MSEL.side === side){ MSEL = {side, k}; render(true); return; }
  const l = side==='L' ? k : MSEL.k, r = side==='R' ? k : MSEL.k;
  if (l === r){ q.pairs[l].ok = true; MSEL = null; speak(sayText(q.pairs[l].es));
    if (q.pairs.every(p => p.ok)){ const e = q.pairs.filter(p => p.err).length; finish(e <= 1, '', e ? `Τα βρήκες, με ${e} ${e===1?'λάθος':'λάθη'}.` : 'Τέλεια, όλα σωστά!'); return; } render(true); }
  else { q.pairs[l].err = true; MFLASH = ['L'+l, 'R'+r]; MSEL = null; render(true); setTimeout(() => { MFLASH = null; if (VIEW==='quiz' && !ANS) render(true); }, 450); }
}
app.addEventListener('click', e => {
  const t = e.target.closest('button, #card'); if (!t) return; const d = t.dataset;
  if (d.slow){ try{ speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(d.slow); u.lang='es-ES'; if (VOICE) u.voice = VOICE; u.rate = .55; speechSynthesis.speak(u); }catch(_){} return; }
  if (d.say){ speak(d.say); return; }
  if (d.tab){ TAB = d.tab; goTab(); return; }
  if (d.guide){ GUIDE = +d.guide; VIEW = 'guideUnit'; S = null; render(); return; }
  if (d.open){ UNIT = +d.open; SET.cur = UNIT; saveLocal(); TAB = 'path'; VIEW = 'unit'; render(); return; }
  if (t.id === 'back'){ if (VIEW==='intro'){ UNIT = S.intro.u; VIEW = 'unit'; S = null; } else if (VIEW==='guideUnit'){ VIEW = 'tab'; TAB = TAB==='path' ? 'path' : 'guide'; if (TAB==='path'){ VIEW='unit'; UNIT = GUIDE; } } else VIEW = 'tab'; render(); return; }
  if (VIEW === 'tab' || VIEW === 'unit'){
    if (t.id === 'cont'){ const l = nextLesson(); if (l){ UNIT = l.u; openLesson(l); } return; }
    if (d.les){ const l = lessonsOf(UNIT).find(x => x.id === d.les); if (l) openLesson(l); return; }
    if (t.id === 'go'){ saveLocal(); startSession(pickMixed(poolFor(SET.units, SET.types), SET.count).map(id => safe(() => build(id, SET.mode))), {kind:'free', title:'Ελεύθερη εξάσκηση'}); return; }
    if (t.id === 'due' || t.id === 'weak'){ const ids = shuffle(t.id==='due' ? dueIds() : weakIds()).slice(0, 15); startSession(ids.map(id => safe(() => build(id, SET.mode))), {kind:'rev', title:t.id==='due'?'Επανάληψη':'Τα λάθη μου'}); return; }
    if (t.id === 'fc'){ const us = SET.units.length ? SET.units : [SET.cur]; FC = {cards:shuffle(us.flatMap(u => (V[u]||[]).map((_,i) => [u,i]))).slice(0,40), i:0, flip:false}; if (FC.cards.length){ VIEW = 'fc'; render(); } return; }
    if (d.u){ const u = +d.u; SET.units = SET.units.includes(u) ? SET.units.filter(x => x!==u) : SET.units.concat(u).sort((a,b) => a-b); }
    else if (d.pre !== undefined) SET.units = d.pre ? d.pre.split(',').map(Number) : [];
    else if (d.ty) SET.types = SET.types.includes(d.ty) ? SET.types.filter(x => x!==d.ty) : SET.types.concat(d.ty);
    else if (d.mode) SET.mode = d.mode;
    else if (d.cnt) SET.count = +d.cnt;
    else if (d.audio) SET.audio = !SET.audio;
    else if (d.goal) SET.goal = SET.goal===30 ? 50 : SET.goal===50 ? 100 : 30;
    else return;
    saveLocal(); render(true); return;
  }
  if (VIEW === 'intro'){ if (t.id === 'begin'){ VIEW = 'quiz'; render(); autoSay(); } return; }
  if (VIEW === 'quiz'){
    const q = S.qs[S.i];
    if (t.id === 'quit'){ const k = S.kind; VIEW = k==='lesson' ? 'unit' : 'tab'; S = null; syncPush(); render(); return; }
    if (t.id === 'next'){ next(); return; }
    if (ANS) return;
    if (d.o !== undefined){ answer(d.o); return; }
    if (d.tile !== undefined){ BANK.push(+d.tile); render(true); return; }
    if (d.un !== undefined){ BANK.splice(+d.un, 1); render(true); return; }
    if (d.m){ matchTap(d.m[0], +d.m.slice(1)); return; }
    if (d.k){ const i = $('#inp'), s = i.selectionStart ?? i.value.length, en = i.selectionEnd ?? s; i.value = i.value.slice(0,s)+d.k+i.value.slice(en); i.focus(); i.setSelectionRange(s+d.k.length, s+d.k.length); return; }
    if (t.id === 'chk'){ if (q.ui==='bank'){ answer(''); return; } const v = $('#inp').value; if (clean(v) || (q.numeric && v.trim())) answer(v); else $('#inp').focus(); return; }
    if (t.id === 'dunno'){ finish(false, ''); return; }
    if (t.id === 'noaudio'){ SET.audio = false; saveLocal(); S.qs = S.qs.filter((x,k) => k < S.i || !x.audio);
      if (S.i < S.qs.length){ ANS = null; BANK = []; MSEL = null; render(); }
      else if (S.res.length){ S.i = S.qs.length - 1; endSession(); }
      else { VIEW = S.kind==='lesson' ? 'unit' : 'tab'; S = null; render(); }
      return; }
    return;
  }
  if (VIEW === 'res'){
    if (t.id === 'again'){ const qs = S.res.filter(r => !r.ok).map(r => safe(() => build(r.q.id, SET.mode))); startSession(shuffle(qs), {kind:'rev', title:'Ξανά τα λάθη'}); return; }
    if (t.id === 'nextles'){ const l = nextLesson(); if (l){ UNIT = l.u; openLesson(l); } return; }
    if (t.id === 'more'){ startSession(pickMixed(poolFor(SET.units, SET.types), SET.count).map(id => safe(() => build(id, SET.mode))), {kind:'free', title:'Ελεύθερη εξάσκηση'}); return; }
    if (t.id === 'home'){ const k = S.kind; VIEW = k==='lesson' ? 'unit' : 'tab'; S = null; render(); return; }
  }
  if (VIEW === 'fc'){
    if (t.id === 'quit'){ VIEW = 'tab'; syncPush(); render(); return; }
    if (t.id === 'card'){ FC.flip = !FC.flip; $('#card').classList.toggle('flip', FC.flip); return; }
    if (t.id === 'nok' || t.id === 'yok'){ const [u,i] = FC.cards[FC.i]; srsMark(`v|${u}|${i}`, t.id==='yok'); if (t.id==='yok') addXp(2); ST.up = Date.now(); saveLocal();
      if (FC.i+1 < FC.cards.length){ FC.i++; FC.flip = false; render(); } else { VIEW = 'tab'; syncPush(); render(); } }
  }
});
app.addEventListener('change', e => {
  if (e.target.id !== 'pack') return; const f = e.target.files && e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try { const p = JSON.parse(r.result); if (!p || p.type !== 'practica-pack' || !p.vocab) throw 0; applyPack(p); if (!hasVocab()) throw 0;
      try { localStorage.setItem(VKEY, JSON.stringify(p)); } catch(_){}
      buildSyn(); for (const k in LCACHE) delete LCACHE[k]; PACKERR = '';
    } catch(_){ PACKERR = 'Αυτό δεν είναι το σωστό αρχείο. Διάλεξε το practica-lexico.json.'; }
    render(true);
  };
  r.readAsText(f);
});
app.addEventListener('keydown', e => { if (e.key==='Enter' && VIEW==='quiz' && e.target.id==='inp' && !ANS){ e.preventDefault(); const v = e.target.value; if (clean(v) || v.trim()) answer(v); } });
document.addEventListener('keydown', e => { if (e.key==='Enter' && VIEW==='quiz' && ANS && e.target.tagName!=='BUTTON'){ e.preventDefault(); next(); } });

render();
syncInit().then(() => { if (VIEW==='tab') render(true); });

</script>

<script>if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));</script>
</body></html>
