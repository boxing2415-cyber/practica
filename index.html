    r.onresult = e => { const alts = Array.from(e.results[0]).map(x => x.transcript), ok = alts.some(x => noAcc(clean(x)) === noAcc(clean(target)));
      say(ok ? `Σωστά! Άκουσα: «${alts[0]}»` : `Άκουσα: «${alts[0]}». Δοκίμασε ξανά.`, ok ? 'ok' : 'bad'); };
    r.onerror = e => say(e.error === 'no-speech' ? 'Δεν άκουσα τίποτα. Δοκίμασε ξανά.' : 'Το μικρόφωνο δεν λειτουργεί εδώ (θέλει Chrome, ίντερνετ και άδεια μικροφώνου).', 'bad');
    r.start();
  } catch(_){ say('Το μικρόφωνο δεν λειτουργεί εδώ.', 'bad'); }
}
function sayAll(lines){ if (!canSpeak) return; try { speechSynthesis.cancel(); for (const t of lines){ const u = new SpeechSynthesisUtterance(t); u.lang = 'es-ES'; if (VOICE) u.voice = VOICE; u.rate = .9; speechSynthesis.speak(u); } } catch(_){} }
function render(keep){
  const y = window.scrollY;
  app.innerHTML = VIEW==='welcome' ? welcomeView() : VIEW==='words' ? wordsView() : VIEW==='backup' ? backupView() : VIEW==='quiz' ? quizView() : VIEW==='intro' ? introView() : VIEW==='res' ? resultView() : VIEW==='fc' ? flashView() : VIEW==='unit' ? unitView() : VIEW==='guideUnit' ? guideUnitView()
    : TAB==='free' ? freeView() : TAB==='rev' ? revView() : TAB==='guide' ? guideView() : pathView();
  if (VIEW==='quiz' && !ANS){ const i = $('#inp') || $('#tin0'); if (i && !S.qs[S.i].audio) i.focus({preventScroll:true}); }
  window.scrollTo(0, keep ? y : 0);
}

/* ================= actions ================= */
function goTab(){ VIEW = 'tab'; render(); }
function matchTap(side, k){
  const q = S.qs[S.i]; if (ANS) return;
  if (!MSEL || MSEL.side === side){ MSEL = {side, k}; render(true); return; }
  const l = side==='L' ? k : MSEL.k, r = side==='R' ? k : MSEL.k;
  if (l === r){ q.pairs[l].ok = true; MSEL = null; speak(sayText(q.pairs[l].es));
    if (q.pairs.every(p => p.ok)){ const e = q.pairs.filter(p => p.err).length; finish(e <= 1, '', e ? `Τα βρήκες, με ${e} ${e===1?'λάθος':'λάθη'}.` : 'Τέλεια, όλα σωστά!'); return; } render(true); }
  else { q.pairs[l].err = true; MFLASH = ['L'+l, 'R'+r]; MSEL = null; render(true); setTimeout(() => { MFLASH = null; if (VIEW==='quiz' && !ANS) render(true); }, 450); }
}
app.addEventListener('click', e => {
  const se = e.target.closest('.es, .es2'); if (se && !e.target.closest('button, #card')){ speak(se.textContent.replace(/\s*[\/·]\s*/g, ', ')); return; }   // any Spanish text can be tapped to hear it
  const t = e.target.closest('button, #card'); if (!t) return; const d = t.dataset;
  if (t.id === 'words'){ VIEW = 'words'; WSLOW = false; render(); return; }
  if (t.id === 'wslow'){ WSLOW = !WSLOW; render(true); return; }
  if (t.id === 'back' && VIEW === 'words'){ VIEW = 'unit'; render(); return; }
  if (d.slow){ try{ speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(d.slow); u.lang='es-ES'; if (VOICE) u.voice = VOICE; u.rate = .55; speechSynthesis.speak(u); }catch(_){} return; }
  if (d.say){ speak(d.say); return; }
  if (d.mic){ listen(d.mic); return; }
  if (d.star){ if (ST.star[d.star]) delete ST.star[d.star]; else ST.star[d.star] = 1; ST.up = Date.now(); saveLocal(); t.classList.toggle('on', !!ST.star[d.star]); t.setAttribute('aria-pressed', !!ST.star[d.star]); return; }
  if (d.skill){ startSkill(d.skill); return; }
  if (t.id === 'quick'){ const u = GUIDE; startSession(shuffle(range(F[u].length)).slice(0,5).map(i => qFill(u, i, 'mc')), {kind:'quick', title:'Γρήγορος έλεγχος · '+uShort(u)}); return; }
  if (d.tab){ TAB = d.tab; goTab(); return; }
  if (d.guide){ GUIDE = +d.guide; VIEW = 'guideUnit'; S = null; render(); return; }
  if (d.open){ UNIT = +d.open; SET.cur = UNIT; saveLocal(); TAB = 'path'; VIEW = 'unit'; render(); return; }
  if (t.id === 'back'){ if (VIEW==='intro'){ UNIT = S.intro.u; VIEW = 'unit'; S = null; } else if (VIEW==='guideUnit'){ VIEW = 'tab'; TAB = TAB==='path' ? 'path' : 'guide'; if (TAB==='path'){ VIEW='unit'; UNIT = GUIDE; } } else VIEW = 'tab'; render(); return; }
  if (VIEW === 'welcome'){
    if (d.wc){ WSEL.course = d.wc; render(true); } else if (d.wp){ WSEL.pace = d.wp; render(true); }
    else if (t.id === 'wgo'){ SET.course = WSEL.course; SET.pace = WSEL.pace; SET.cur = CU()[0]; SET.units = SET.course === 'zero' ? [21] : [1,2,3]; saveLocal(); TAB = 'path'; VIEW = 'tab'; render(); }
    return;
  }
  if (VIEW === 'tab' || VIEW === 'unit'){
    if (d.course){ if (d.course !== SET.course){ SET.curs[SET.course] = SET.cur; SET.course = d.course; SET.cur = CU().includes(SET.curs[d.course]) ? SET.curs[d.course] : CU()[0]; saveLocal(); render(); } return; }
    if (t.id === 'cont'){ const l = nextLesson(); if (l){ UNIT = l.u; openLesson(l); } return; }
    if (t.id === 'daily'){ startSession(dailyQs(), {kind:'daily', title:'Σημερινά 10 λεπτά'}); return; }
    if (t.id === 'bk'){ BKMSG = ''; VIEW = 'backup'; render(); return; }
    if (d.les){ const l = lessonsOf(UNIT).find(x => x.id === d.les); if (l) openLesson(l); return; }
    if (t.id === 'go'){ saveLocal(); startSession(pickMixed(poolFor(SET.units, SET.types), SET.count).map(id => safe(() => build(id, SET.mode))), {kind:'free', title:'Ελεύθερη εξάσκηση'}); return; }
    if (t.id === 'due' || t.id === 'weak'){ const ids = shuffle(t.id==='due' ? dueIds() : weakIds()).slice(0, 15); startSession(ids.map(id => safe(() => build(id, SET.mode))), {kind:'rev', title:t.id==='due'?'Επανάληψη':'Τα λάθη μου'}); return; }
    if (t.id === 'fc'){ const us = SET.units.length ? SET.units : [SET.cur]; FC = {cards:shuffle(us.flatMap(u => (V[u]||[]).map((_,i) => [u,i]))).slice(0,40), i:0, flip:false}; if (FC.cards.length){ VIEW = 'fc'; render(); } return; }
    if (t.id === 'fcs'){ FC = {cards:shuffle(Object.keys(ST.star).map(id => id.split('|')).filter(p => p[0]==='v' && V[p[1]] && V[p[1]][+p[2]]).map(p => [+p[1], +p[2]])), i:0, flip:false}; if (FC.cards.length){ VIEW = 'fc'; render(); } return; }
    if (d.u){ const u = +d.u; SET.units = SET.units.includes(u) ? SET.units.filter(x => x!==u) : SET.units.concat(u).sort((a,b) => a-b); }
    else if (d.pre !== undefined) SET.units = d.pre ? d.pre.split(',').map(Number) : [];
    else if (d.ty) SET.types = SET.types.includes(d.ty) ? SET.types.filter(x => x!==d.ty) : SET.types.concat(d.ty);
    else if (d.mode) SET.mode = d.mode;
    else if (d.cnt) SET.count = +d.cnt;
    else if (d.audio) SET.audio = !SET.audio;
    else if (d.speak) SET.speak = !SET.speak;
    else if (d.pace) SET.pace = d.pace;
    else if (d.goal) SET.goal = SET.goal===30 ? 50 : SET.goal===50 ? 100 : 30;
    else return;
    saveLocal(); render(true); return;
  }
  if (VIEW === 'backup'){
    if (t.id === 'pkcopy'){ copyBox('pkout', 'pkmsg', 'Το λεξιλόγιο αντιγράφηκε. Άνοιξε την εγκατεστημένη εφαρμογή στον Chrome και πάτα «Επικόλληση λεξιλογίου».'); return; }
    if (t.id === 'bkcopy'){ const o = $('#bkout'), done = () => { $('#bkmsg').textContent = 'Ο κωδικός αντιγράφηκε. Επικόλλησέ τον κάπου για να τον κρατήσεις.'; };
      try { o.focus(); o.select(); if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(o.value).then(done, () => { try { document.execCommand('copy'); done(); } catch(_){ $('#bkmsg').textContent = 'Κράτα πατημένο πάνω στον κωδικό και διάλεξε «Αντιγραφή».'; } }); else { document.execCommand('copy'); done(); } } catch(_){ $('#bkmsg').textContent = 'Κράτα πατημένο πάνω στον κωδικό και διάλεξε «Αντιγραφή».'; }
      return; }
    if (t.id === 'bkload'){
      try { const o = JSON.parse(decodeURIComponent(escape(atob($('#bkin').value.replace(/\s+/g, ''))))); if (!o || o.k !== 'practica-backup' || !o.st) throw 0;
        ST = adopt(o.st); ST.up = Date.now(); if (o.set) SET = Object.assign(SET, o.set); saveLocal(); syncPush(); BKMSG = 'Η πρόοδος επανήλθε (' + ST.xp + ' πόντοι).'; render(); }
      catch(_){ $('#bkmsg').textContent = 'Ο κωδικός δεν είναι σωστός. Επικόλλησέ τον ολόκληρο, χωρίς αλλαγές.'; }
      return; }
    return;
  }
  if (VIEW === 'intro'){ if (t.id === 'begin'){ try{ speechSynthesis.cancel(); }catch(_){} VIEW = 'quiz'; render(); autoSay(); }
    else if (t.id === 'trtog'){ DTR = !DTR; render(true); } else if (t.id === 'sayall'){ sayAll(DG[S.intro.u].l.map(x => x[1])); }
    return; }
  if (VIEW === 'quiz'){
    const q = S.qs[S.i];
    if (t.id === 'quit'){ const k = S.kind; VIEW = k==='lesson' ? 'unit' : k==='quick' ? 'guideUnit' : 'tab'; S = null; syncPush(); render(); return; }
    if (t.id === 'next'){ next(); return; }
    if (ANS) return;
    if (d.o !== undefined){ answer(d.o); return; }
    if (d.tile !== undefined){ if (audioOn()) speak(q.tiles[+d.tile]); BANK.push(+d.tile); render(true); return; }
    if (d.un !== undefined){ BANK.splice(+d.un, 1); render(true); return; }
    if (d.m){ if (audioOn() && !/[α-ωά-ώ]/i.test(t.textContent)) speak(t.textContent); matchTap(d.m[0], +d.m.slice(1)); return; }
    if (d.k){ const i = (LASTINP && $('#'+LASTINP)) || $('#inp') || $('#tin0'), s = i.selectionStart ?? i.value.length, en = i.selectionEnd ?? s; i.value = i.value.slice(0,s)+d.k+i.value.slice(en); i.focus(); i.setSelectionRange(s+d.k.length, s+d.k.length); return; }
    if (t.id === 'chk' && q.ui === 'table'){ const vals = q.rows.map((_, p) => $('#tin'+p).value); if (vals.some(v => clean(v))) answerTable(vals); else $('#tin0').focus(); return; }
    if (t.id === 'dunno' && q.ui === 'table'){ answerTable([]); return; }
    if (t.id === 'chk'){ if (q.ui==='bank'){ answer(''); return; } const v = $('#inp').value; if (clean(v) || (q.numeric && v.trim())) answer(v); else $('#inp').focus(); return; }
    if (t.id === 'dunno'){ finish(false, ''); return; }
    if (t.id === 'noaudio'){ SET.audio = false; saveLocal(); S.qs = S.qs.filter((x,k) => k < S.i || !x.audio);
      if (S.i < S.qs.length){ ANS = null; BANK = []; MSEL = null; render(); }
      else if (S.res.length){ S.i = S.qs.length - 1; endSession(); }
      else { VIEW = S.kind==='lesson' ? 'unit' : 'tab'; S = null; render(); }
      return; }
    return;
  }
  if (VIEW === 'res'){
    if (t.id === 'again'){ const qs = S.res.filter(r => !r.ok).map(r => safe(() => build(r.q.id, SET.mode))); startSession(shuffle(qs), {kind:'rev', title:'Ξανά τα λάθη'}); return; }
    if (t.id === 'nextles'){ const l = nextLesson(); if (l){ UNIT = l.u; openLesson(l); } return; }
    if (t.id === 'more'){ startSession(pickMixed(poolFor(SET.units, SET.types), SET.count).map(id => safe(() => build(id, SET.mode))), {kind:'free', title:'Ελεύθερη εξάσκηση'}); return; }
    if (t.id === 'home'){ const k = S.kind; VIEW = k==='lesson' ? 'unit' : k==='quick' ? 'guideUnit' : 'tab'; S = null; render(); return; }
  }
  if (VIEW === 'fc'){
    if (t.id === 'quit'){ VIEW = 'tab'; syncPush(); render(); return; }
    if (t.id === 'card'){ FC.flip = !FC.flip; $('#card').classList.toggle('flip', FC.flip); return; }
    if (t.id === 'nok' || t.id === 'yok'){ const [u,i] = FC.cards[FC.i]; srsMark(`v|${u}|${i}`, t.id==='yok'); if (t.id==='yok') addXp(2); ST.up = Date.now(); saveLocal();
      if (FC.i+1 < FC.cards.length){ FC.i++; FC.flip = false; render(); } else { VIEW = 'tab'; syncPush(); render(); } }
  }
});
app.addEventListener('focusin', e => { if (e.target.classList && e.target.classList.contains('inp')) LASTINP = e.target.id; });
app.addEventListener('input', e => { const id = e.target.dataset && e.target.dataset.note; if (!id) return; const v = e.target.value.trim().slice(0,120); if (v) ST.note[id] = v; else delete ST.note[id]; ST.up = Date.now(); saveLocal(); });
app.addEventListener('keydown', e => { if (e.key !== 'Enter' || VIEW !== 'quiz' || ANS || !e.target.classList.contains('tin')) return; e.preventDefault(); e.stopPropagation();
  const p = +e.target.id.slice(3); if (p < 5) $('#tin'+(p+1)).focus(); else { const q = S.qs[S.i]; answerTable(q.rows.map((_, k) => $('#tin'+k).value)); } });
app.addEventListener('change', e => {
  if (e.target.id !== 'pack') return; const f = e.target.files && e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => { loadPack(r.result); render(true); };
  r.readAsText(f);
});
app.addEventListener('click', e => {
  const b = e.target.closest('#packpaste, #packgo'); if (!b) return;
  if (b.id === 'packgo'){ loadPack($('#packtxt').value); render(true); return; }
  const open = () => { PASTEBOX = true; PACKERR = ''; render(true); const x = $('#packtxt'); if (x) x.focus(); };
  if (navigator.clipboard && navigator.clipboard.readText) navigator.clipboard.readText().then(t => { if (t && t.includes('practica-pack') && loadPack(t)) render(true); else open(); }, open); else open();
});
app.addEventListener('keydown', e => { if (e.key==='Enter' && VIEW==='quiz' && e.target.id==='inp' && !ANS){ e.preventDefault(); e.stopPropagation(); const v = e.target.value; if (clean(v) || v.trim()) answer(v); } });
document.addEventListener('keydown', e => { if (e.key==='Enter' && VIEW==='quiz' && ANS && e.target.tagName!=='BUTTON' && !(e.target.dataset && e.target.dataset.note)){ e.preventDefault(); next(); } });

if (!SET.course) VIEW = 'welcome';
render();
syncInit().then(() => { if (VIEW==='welcome' && (ST.xp > 0 || Object.keys(ST.done).length)){ SET.course = 'book'; SET.cur = CU().includes(SET.cur) ? SET.cur : 1; saveLocal(); VIEW = 'tab'; render(); } else if (VIEW==='tab') render(true); });

</script>
